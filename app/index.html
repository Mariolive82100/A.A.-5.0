<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Armieri 5.0</title>
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Armieri 5.0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400..700;1,400..700&display=swap" media="print" onload="this.media='all'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#0b1020;--bg2:#0e1426;--card:#131b2e;--card2:#18223a;--line:#24304a;--line2:#2e3b58;
  --tx:#eef2f9;--tx2:#b6c0d2;--mut:#7f8ba3;
  --amber:#f5a524;--amber2:#fbbf24;--green:#34d399;--red:#fb7185;--sky:#38bdf8;--violet:#a78bfa;--pink:#f472b6;--teal:#2dd4bf;
  --r:18px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Google Sans","Google Sans Flex","Product Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.35;min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:16px;height:16px}svg.i.l{width:26px;height:26px}
button,input,select,textarea{font-family:inherit}
.mono{font-family:inherit;font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.2px}
.mut{color:var(--mut)}.tx2{color:var(--tx2)}.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.sky{color:var(--sky)}.violet{color:var(--violet)}
.hidden{display:none!important}

/* header */
header{position:sticky;top:0;z-index:30;background:rgba(11,16,32,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(10px + var(--safe-t)) 12px 10px;display:flex;align-items:center;gap:10px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--tx2);position:relative}
.iconbtn:active{background:var(--card2)}
.brand{flex:1;min-width:0}
header.hasrank{gap:6px}
header.hasrank .brand{flex:0 1 auto;min-width:64px}
@media (max-width:399px){.rankpill .rk-t{display:none}}
header.hasrank #hdr-update{margin-left:0!important}
.rankpill{margin:0 auto;padding:4px 8px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--tx2);font-size:11px;font-weight:800;white-space:nowrap;cursor:pointer;flex:0 0 auto}
.rankpill.g1{border-color:rgba(251,191,36,.7);background:linear-gradient(135deg,rgba(251,191,36,.30),rgba(245,165,36,.10));color:#fde68a;box-shadow:0 0 10px rgba(251,191,36,.25)}
.rankpill.g2{border-color:rgba(203,213,225,.6);background:rgba(203,213,225,.14);color:#e2e8f0}
.rankpill.g3{border-color:rgba(217,119,6,.6);background:rgba(217,119,6,.16);color:#fdba74}
.rankpill.idle{font-weight:700;color:var(--mut)}
.brand b{display:flex;align-items:center;gap:6px;font-size:16px;background:linear-gradient(90deg,var(--amber),#fde68a);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand b svg{color:var(--amber)}
.brand small{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
.dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}.dot.off{background:var(--amber)}.dot.err{background:var(--red)}
.chip-saldo{padding:6px 10px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-weight:800;font-size:15px;text-align:right;line-height:1.1}
.chip-saldo small{display:block;font-size:10px;font-weight:600;color:var(--mut)}
.badge{position:absolute;top:3px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center}

main{max-width:640px;margin:0 auto;padding:14px 14px calc(96px + var(--safe-b))}
h2{font-size:18px;margin:0 0 2px;display:flex;align-items:center;gap:8px}
.sub{font-size:12.5px;color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);display:flex;align-items:center;gap:6px;justify-content:space-between}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 14px;border-radius:14px;font-weight:700;font-size:14px;background:var(--card2);border:1px solid var(--line2);color:var(--tx);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.sm{padding:7px 10px;font-size:12.5px;border-radius:11px}
.btn.block{width:100%}
.btn.amber{background:linear-gradient(90deg,var(--amber),#f59e0b);color:#1a1205;border:0}
.btn.green{background:#059669;border-color:#059669;color:#fff}
.btn.red{background:#be123c;border-color:#be123c;color:#fff}
.btn.violet{background:#7c3aed;border-color:#7c3aed;color:#fff}
.btn.ghost{background:transparent;border-color:var(--line)}
.pbar{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 14px;margin-bottom:10px}
.pbar.on{border-color:rgba(52,211,153,.55);background:linear-gradient(135deg,var(--card),rgba(16,185,129,.11))}
.pbr1{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14.5px}
.pbg{height:6px;border-radius:99px;background:rgba(255,255,255,.09);margin:9px 0;overflow:hidden}
.pbg i{display:block;height:100%;border-radius:99px;background:var(--mut);transition:width .6s ease}
.pbar.on .pbg i{background:linear-gradient(90deg,#10b981,#34d399)}
.pbar.done .pbg i{background:#7c3aed}
.pbr3{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pbs{flex:1;min-width:0;font-size:12.5px;line-height:1.3;color:var(--tx2)}
.pulbtn{white-space:nowrap;background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:0;box-shadow:0 3px 10px rgba(16,185,129,.35)}
.pulbtn:active{transform:scale(.93)}
.pulbtn:disabled{background:var(--card2);color:var(--mut);box-shadow:none;border:1px solid var(--line)}
.btn.regalo,.btn.acquisto{color:#fff;border:0;padding:14px 10px;font-size:14px;line-height:1.25;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.28)}
.btn.regalo{background:linear-gradient(135deg,#ec4899,#e11d48)}
.btn.acquisto{background:linear-gradient(135deg,#0ea5e9,#0d9488)}
.btn.link{background:none;border:0;padding:4px 6px;color:var(--amber);font-size:12.5px}
.btn.big{padding:16px;font-size:15px;border-radius:16px}
.btn.giro{background:linear-gradient(90deg,#6366f1,#9333ea);color:#fff;border:0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px;text-align:left;display:block;width:100%}
.tile:active{transform:scale(.98)}
.home{position:relative;overflow:hidden;border-radius:28px;min-height:calc(100vh - 230px);display:flex;flex-direction:column;justify-content:flex-start}
.home .grid{align-content:start}
.gm-hint{border-radius:16px;padding:10px;border:1px solid var(--line);background:rgba(255,255,255,.05)}
.gm-hint.su{border-color:rgba(245,165,36,.5)}.gm-hint.giu{border-color:rgba(56,189,248,.5)}
.gm-hint b{display:block;font-size:20px}.gm-arrow{display:block;font-size:44px;line-height:1.1;animation:gm-pop .5s ease-out}
.gm-final{position:relative;overflow:hidden;text-align:center;padding:26px 14px;margin-bottom:12px}
.gm-conf{position:absolute;inset:0;pointer-events:none}.gm-conf span{position:absolute;top:-40px;animation:gm-fall 3.2s linear infinite}
.gm-cup{font-size:84px;line-height:1.1;animation:gm-bounce 1s ease-in-out infinite}
.gm-loser{font-size:38px;font-weight:900;margin:6px 0;background:linear-gradient(90deg,#f5a524,#f472b6,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent;animation:gm-pop .7s ease-out}
@keyframes gm-fall{to{transform:translateY(420px) rotate(360deg);opacity:.2}}
@keyframes gm-bounce{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-14px) rotate(8deg)}}
@keyframes gm-pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.home .blob{position:absolute;border-radius:50%;filter:blur(46px);opacity:.55;pointer-events:none;z-index:0}
.home .grid{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gbtn{position:relative;min-height:min(30vh,210px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:14px;border-radius:26px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);color:var(--tx);font-weight:800;font-size:clamp(19px,5.4vw,27px);line-height:1.15;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.gbtn:active{transform:scale(.97)}
.gbtn:disabled{opacity:.42;filter:grayscale(.5)}
.gbtn:disabled:active{transform:none}
.tgl{width:48px;height:28px;border-radius:14px;background:var(--line2);border:0;position:relative;flex:none;padding:0}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.tgl.on{background:var(--green)}
.tgl.on::after{left:23px}
.gbtn small{font-size:12.5px;font-weight:600;color:var(--tx2)}
.gbtn.sm{min-height:min(19vh,132px);padding:10px;gap:6px;border-radius:22px;font-size:14px}.gbtn.sm .em{font-size:30px}
.ruota-box{position:relative;width:min(78vw,300px);margin:10px auto 12px}.ruota-box svg{width:100%;height:auto;display:block}
.ruota-pt{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:22px solid var(--amber);filter:drop-shadow(0 2px 2px rgba(0,0,0,.45));z-index:2}
@keyframes ruota-spin{from{transform:rotate(var(--from))}to{transform:rotate(var(--to))}}
.perla{border:1px solid var(--line);border-radius:16px;background:var(--card2);padding:12px 14px;margin-bottom:10px}
.perla q{display:block;font-size:15.5px;font-weight:600;line-height:1.4;quotes:'«' '»';word-break:break-word}
.gbtn .em{font-size:34px;line-height:1}
.gbtn.adm{border-color:rgba(167,139,250,.38);background:linear-gradient(135deg,rgba(245,165,36,.13),rgba(124,58,237,.16))}
body.adm header{border-bottom:2px solid var(--violet)}
.tbw{position:relative;display:inline-flex}
.tb{position:absolute;top:-5px;right:-9px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1}
.tb.tbi{position:static;display:inline-flex;margin-left:6px;vertical-align:middle}
.atabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:14px 0 12px;padding:4px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.atabs button{position:relative;padding:8px 1px;border-radius:12px;font-weight:700;font-size:10.5px;color:var(--tx2);display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1}
.atabs button>span:first-child{font-size:17px}
.atabs button.on{background:rgba(124,58,237,.18);color:#c4b5fd;box-shadow:inset 0 0 0 1px var(--violet)}
.atabs .tb{top:2px;right:6px}
.swbar{display:flex;gap:6px;margin-bottom:12px;padding:4px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.swbar button{flex:1;padding:10px 6px;border-radius:12px;font-weight:700;font-size:12.5px;color:var(--tx2)}
.swbar button.on{background:var(--card2);color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.swbar button.on.adm{color:#c4b5fd;box-shadow:inset 0 0 0 1px var(--violet);background:rgba(124,58,237,.18)}
.sbadge{padding:6px 11px;border-radius:99px;font-weight:800;font-size:13px;font-family:ui-monospace,Menlo,monospace;white-space:nowrap;border:1px solid transparent}
.sbadge.pos{background:rgba(16,185,129,.14);color:var(--green);border-color:rgba(16,185,129,.35)}
.sbadge.neg{background:rgba(251,113,133,.14);color:var(--red);border-color:rgba(251,113,133,.35)}
.tesoro{background:linear-gradient(135deg,var(--card),rgba(124,58,237,.16));border-color:rgba(167,139,250,.35)}
.tesoro .big{font-size:30px;font-weight:800;line-height:1.1}
.homebtns{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.homebtns .btn{min-height:52px;font-size:14px}
main.wide{max-width:980px}
.book{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.book .col{min-width:0}
.booktabs{display:none;gap:6px;margin-bottom:10px}
.booktabs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:13px;color:var(--tx2)}
.booktabs button.on{background:var(--card2);color:var(--amber);border-color:var(--amber)}
.col h4{margin:0 0 2px;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.col .cap{font-size:11.5px;color:var(--mut);margin:0 0 8px}
@media(max-width:720px){.book{grid-template-columns:1fr}.book .col:not(.on){display:none}.booktabs{display:flex}}
.tile .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;margin-bottom:10px}
.tile b{display:block;font-size:14.5px}.tile span{font-size:12px;color:var(--mut)}
.ic.amber{background:rgba(245,165,36,.12);color:var(--amber)}.ic.red{background:rgba(251,113,133,.12);color:var(--red)}.ic.green{background:rgba(52,211,153,.12);color:var(--green)}.ic.violet{background:rgba(167,139,250,.12);color:var(--violet)}.ic.sky{background:rgba(56,189,248,.12);color:var(--sky)}.ic.pink{background:rgba(244,114,182,.12);color:var(--pink)}.ic.mut{background:var(--card2);color:var(--tx2)}
.qty{display:flex;align-items:center;justify-content:center;gap:18px;margin:6px 0 14px}
.qty button{width:44px;height:44px;border-radius:14px;background:var(--card2);border:1px solid var(--line2);font-size:22px;font-weight:700}
.qty span{font-size:30px;font-weight:800;color:var(--amber);min-width:44px;text-align:center}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:700;margin-bottom:3px}
.stat b{font-size:16px}
.list>*{border-top:1px solid var(--line)}
.list>*:first-child{border-top:0}
.li{display:flex;align-items:center;gap:11px;padding:11px 2px}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis}
.li .d{font-size:11.5px;color:var(--mut);margin-top:1px}
.li .amt{font-weight:800;font-size:14px;text-align:right;white-space:nowrap}
.av{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;font-size:17px;background:var(--card2)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;font-size:10.5px;font-weight:800;white-space:nowrap}
.pill.amber{background:rgba(245,165,36,.14);color:var(--amber)}.pill.green{background:rgba(52,211,153,.13);color:var(--green)}.pill.red{background:rgba(251,113,133,.13);color:var(--red)}.pill.mut{background:var(--card2);color:var(--mut)}.pill.violet{background:rgba(167,139,250,.14);color:var(--violet)}.pill.sky{background:rgba(56,189,248,.13);color:var(--sky)}
.strike{text-decoration:line-through;opacity:.55}
.empty{padding:22px 8px;text-align:center;color:var(--mut);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{padding:7px 12px;border-radius:99px;border:1px solid var(--line2);font-size:12.5px;font-weight:700;color:var(--tx2)}
.chips button.on{background:var(--amber);border-color:var(--amber);color:#1a1205}
.hero{background:linear-gradient(135deg,var(--card),rgba(245,165,36,.14));border-color:rgba(245,165,36,.35)}
.herotag{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--amber)}
.hero-main{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:8px 0 10px}
.hero-pos{font-size:34px;font-weight:800;line-height:1.05}.hero-pos small{font-size:14px;font-weight:700;color:var(--mut)}
.hero-tot{text-align:right}.hero-tot b{display:block;font-size:30px;font-weight:800;color:var(--amber);line-height:1}.hero-tot small{font-size:11.5px;color:var(--mut)}
.hero-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.hero-grid div{background:var(--card2);border-radius:12px;padding:8px 2px;text-align:center;min-width:0}
.hero-grid span{display:block;font-size:16px}.hero-grid b{display:block;font-size:17px;font-weight:800}.hero-grid small{display:block;font-size:10.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-msg{margin:10px 0 0;font-size:13.5px;font-weight:600}.hero-tit{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.pod{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end;margin:6px 0 14px}
.pc{text-align:center;min-width:0}.pc .md{font-size:26px;line-height:1.1}.pc .pn{font-size:12.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .pb{min-height:20px;display:flex;justify-content:center;align-items:center;gap:4px;font-size:13px}.pc .pv{font-size:20px;font-weight:800;color:var(--amber)}
.pc .ps{margin-top:6px;border-radius:12px 12px 0 0;background:var(--card2);border:1px solid var(--line2);border-bottom:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:var(--mut)}
.pc.me .ps{background:rgba(245,165,36,.18);border-color:rgba(245,165,36,.5);color:var(--amber)}
.rk{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--card2);margin-bottom:8px}
.rk.me{border-color:rgba(245,165,36,.5);background:rgba(245,165,36,.10)}.rk.z{opacity:.6}
.rk .n{width:24px;text-align:center;font-weight:800;color:var(--mut);flex:none}.rk .nm{flex:1;min-width:0}
.rk .nt{display:flex;align-items:center;gap:6px;min-width:0}.rk .nn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.rk .nt .pill,.rk-bdg{flex:none}
.rk .mi{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11.5px;color:var(--mut);margin-top:3px}
.rk .v{flex:none;text-align:right;font-size:20px;font-weight:800;color:var(--amber)}.rk .v small{display:block;font-size:10.5px;font-weight:600;color:var(--mut)}

.pbar.off{opacity:.75}.pbar.off .pbs{color:var(--amber,#f5a524)}
.rg{margin:0;padding-left:18px}.rg li{font-size:13.5px;line-height:1.45;color:var(--tx2);margin:0 0 6px}.rg li b{color:var(--tx)}
.rdot{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px #0b1020}
.tessera{display:block;width:100%;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:14px;text-align:left;background:transparent;color:inherit;cursor:pointer}
.tessera.ok{border-color:var(--green);background:rgba(52,211,153,.10)}
.tessera.ok .bar i{background:var(--green)}
.tess-ok{margin-top:8px;font-weight:800;color:var(--green);font-size:13.5px;text-align:center}
.sala{background:linear-gradient(135deg,rgba(245,165,36,.16),rgba(245,165,36,.05));border:1px solid rgba(245,165,36,.35);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.sala-l{font-size:13px;font-weight:700;color:var(--tx2)}.sala-v{font-size:34px;font-weight:800;color:var(--amber);line-height:1}
.bar{height:8px;border-radius:5px;background:var(--card2);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),#818cf8);border-radius:5px}
.cols{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:6px}
.cols div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.cols i{display:block;width:100%;max-width:34px;background:linear-gradient(180deg,var(--amber),#b45309);border-radius:6px 6px 2px 2px;min-height:2px}
.cols span{font-size:9.5px;color:var(--mut);white-space:nowrap}
.cols b{font-size:10px;color:var(--tx2)}
/* grafico andamento caffè (statistiche saletta) */
.sc{width:100%;height:auto;display:block;overflow:visible}
.sc text{font-size:10px;fill:var(--mut);font-family:inherit}
.sc .gl{stroke:var(--line);stroke-width:1}
.sc .hit{fill:transparent;cursor:pointer}
.sc-info{min-height:38px;margin:0 0 6px;font-size:13px;color:var(--tx2)}
.sc-info b{color:var(--tx)}
.banner{border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.banner.amber{background:rgba(245,165,36,.1);border:1px solid rgba(245,165,36,.3);color:#fde68a}
.banner.red{background:rgba(251,113,133,.1);border:1px solid rgba(251,113,133,.3);color:#fecdd3}
.banner.sky{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.25);color:#bae6fd}
.avv{position:relative;display:block;width:100%;text-align:center;margin:0 0 8px;padding:8px 14px;border-radius:18px;border:1.5px solid var(--avc);background:var(--avb);color:var(--avt);font:inherit;animation:avv-respiro 2.6s ease-in-out infinite}
button.avv{cursor:pointer}
.avv .avv-t{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;opacity:.9;line-height:1.3}
.avv .avv-m{margin-top:3px;font-size:14.5px;font-weight:700;line-height:1.3;word-break:break-word}
.avv .iconbtn{position:absolute;top:4px;right:6px;width:30px;height:30px}
.avv.amber{--avc:rgba(245,165,36,.75);--avb:rgba(245,165,36,.14);--avt:#fde68a;--avg:245,165,36}
.avv.red{--avc:rgba(251,113,133,.75);--avb:rgba(251,113,133,.14);--avt:#fecdd3;--avg:251,113,133}
.avv.sky{--avc:rgba(56,189,248,.75);--avb:rgba(56,189,248,.13);--avt:#bae6fd;--avg:56,189,248}
.avv.green{--avc:rgba(16,185,129,.8);--avb:rgba(16,185,129,.15);--avt:#a7f3d0;--avg:16,185,129}
.avv.violet{--avc:rgba(167,139,250,.8);--avb:rgba(167,139,250,.14);--avt:#ddd6fe;--avg:167,139,250}
@keyframes avv-respiro{0%,100%{opacity:.82;box-shadow:0 0 0 0 rgba(var(--avg),0)}50%{opacity:1;box-shadow:0 0 18px 2px rgba(var(--avg),.36)}}
@media (prefers-reduced-motion:reduce){.avv{animation:none}}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th.s{cursor:pointer}th.r,td.r{text-align:right}th.c,td.c{text-align:center}
td{padding:10px 6px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.stepper{display:inline-flex;align-items:center;gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:2px}
.stepper button{width:28px;height:28px;border-radius:9px;font-weight:800;color:var(--tx2)}
.stepper button:active{background:var(--card2)}
.stepper b{min-width:26px;text-align:center}

/* form */
label.f{display:block;margin-bottom:11px}
label.f>span{display:block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
.in{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:11px 12px;font-size:16px;outline:none}
.in:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(245,165,36,.15)}
textarea.in{min-height:96px;resize:vertical}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg input{display:none}
.seg label{padding:11px 6px;text-align:center;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);font-size:13px;font-weight:700;color:var(--tx2);cursor:pointer}
.seg input:checked+label{border-color:var(--amber);color:var(--amber);background:rgba(245,165,36,.08)}
.seg label.off{opacity:.45;cursor:not-allowed;filter:grayscale(.6)}.seg label .nd{display:block;font-size:10.5px;font-weight:700;margin-top:2px}
.rvsw{display:flex;align-items:center;gap:12px;width:100%;text-align:left}.rvsw .trk{flex:none;width:46px;height:26px;border-radius:99px;background:var(--line2);position:relative;transition:background .2s}.rvsw .trk::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}.rvsw.on .trk{background:var(--green)}.rvsw.on .trk::after{transform:translateX(20px)}
.cerca{display:flex;gap:6px;margin:0 0 10px}.cerca .in{flex:1;min-width:0;padding:9px 12px;font-size:14px}[data-q][hidden]{display:none!important}.cerca-vuoto{padding:10px;font-size:13px}
.ibtn{display:inline-flex;align-items:center;justify-content:center;flex:none;width:22px;height:22px;margin-left:6px;border-radius:50%;border:1.5px solid var(--mut);background:transparent;color:var(--tx2);font:italic 700 13px/1 Georgia,serif;cursor:pointer;vertical-align:middle;padding:0;text-transform:none;letter-spacing:0}
.hint-i{display:inline-flex;align-items:center;gap:6px;margin:2px 0 10px;padding:2px 0;background:none;border:0;color:var(--mut);font-size:12.5px;cursor:pointer}.hint-i .ibtn{margin:0}
#infopop{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(0,0,0,.55)}#infopop.on{display:flex}
.ip-card{max-width:420px;max-height:80vh;overflow:auto;background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:16px 18px;font-size:14px;line-height:1.5;color:var(--tx2);box-shadow:0 12px 40px rgba(0,0,0,.5)}
.check{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--line);background:var(--bg2);border-radius:13px;margin-bottom:7px;cursor:pointer}
.check input{width:19px;height:19px;accent-color:var(--violet)}
.hint{font-size:12px;color:var(--mut);margin:-4px 0 12px}

/* dock */
nav.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(11,16,32,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:block;padding:6px 4px calc(6px + var(--safe-b))}
nav.dock .dk{display:flex}
nav.dock button.fab{display:flex;flex-direction:column;align-items:center;flex:none;width:86px;height:86px;margin:-34px 6px 0;border-radius:50%;background:radial-gradient(circle at 30% 25%,#232b4a,#131a33);border:2px solid var(--amber);box-shadow:0 6px 22px rgba(0,0,0,.55),0 0 0 5px rgba(11,16,32,.94);justify-content:center;gap:2px;padding:4px;color:var(--tx)}
nav.dock button.fab small{font-size:10.5px;font-weight:600;color:var(--tx2);max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.dock button.fab b{font-size:15px;line-height:1.1;max-width:78px;white-space:nowrap}
nav.dock button.fab.on{border-color:var(--green);transform:scale(.96)}
#fab-ov{position:fixed;inset:0;z-index:31;background:rgba(2,6,23,.6);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);display:none}
#fab-ov.on{display:block}
#fab-menu{position:fixed;left:50%;bottom:calc(112px + var(--safe-b));transform:translateX(-50%);z-index:32;display:none;gap:10px;align-items:flex-end}
#fab-menu.on{display:flex}
#fab-menu button{width:94px;min-height:94px;border-radius:26px;background:var(--card);border:1px solid var(--line2);color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700;text-align:center;padding:8px 4px;line-height:1.15}
#fab-menu button:nth-child(2){margin-bottom:22px}
#fab-menu button:disabled{opacity:.35}
#fab-menu button.a1{border-color:var(--amber);color:var(--amber)}
#fab-menu button.a2{border-color:var(--sky);color:var(--sky)}
#fab-menu button.a3{border-color:var(--green);color:var(--green)}
nav.dock .dk button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:13px;color:var(--mut);font-size:10px;font-weight:700;min-width:0;flex:1;text-align:center;line-height:1.1}
nav.dock .dk button.on{color:var(--amber)}

/* drawer */
.ov{position:fixed;inset:0;z-index:40;background:rgba(2,6,23,.7);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
aside.drawer{position:fixed;top:0;bottom:0;left:0;z-index:41;width:280px;max-width:84vw;background:var(--card);border-right:1px solid var(--line);padding:calc(16px + var(--safe-t)) 12px 16px;transform:translateX(-102%);transition:transform .25s;display:flex;flex-direction:column;overflow-y:auto}
aside.drawer.on{transform:none}
aside.drawer .nb{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:13px;font-weight:600;font-size:14px;color:var(--tx2);text-align:left}
aside.drawer .nb.on{background:var(--card2);color:var(--amber)}
aside.drawer .sep{height:1px;background:var(--line);margin:8px 4px}

/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:8px 16px calc(18px + var(--safe-b));max-height:88vh;overflow-y:auto;transform:translateY(105%);transition:transform .25s}
.sheet.on{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line2);margin:4px auto 12px}
.sheet h3{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:8px}
.sheet .sub{margin-bottom:14px}
#sheet-ov{z-index:50}

/* toast */
#toast{position:fixed;left:50%;top:calc(12px + var(--safe-t));z-index:60;transform:translate(-50%,-160%);transition:transform .25s;background:#1d2740;border:1px solid var(--line2);border-radius:16px;padding:11px 14px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:10px;max-width:92vw;box-shadow:0 12px 30px rgba(0,0,0,.45)}
#toast.on{transform:translate(-50%,0)}
#toast.err{border-color:rgba(251,113,133,.5)}
#toast button{color:var(--amber);font-weight:800;padding:2px 6px;white-space:nowrap}

/* entry screens */
.hero{text-align:center;padding:28px 6px 18px}
.hero .logo{width:76px;height:76px;border-radius:24px;margin:0 auto 14px;background:rgba(245,165,36,.12);border:1px solid rgba(245,165,36,.3);display:grid;place-items:center;color:var(--amber)}
.hero h1{margin:0 0 6px;font-size:26px;background:linear-gradient(90deg,var(--amber),#fde68a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:var(--tx2);font-size:14px}
.code{font-size:20px;font-weight:800;letter-spacing:.08em;text-align:center;padding:12px;border-radius:14px;background:var(--bg2);border:1px dashed var(--line2);user-select:all}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--amber);animation:sp 1s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.4;color:var(--tx2)}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:rgba(245,165,36,.14);color:var(--amber);font-weight:800;font-size:13px;display:grid;place-items:center}
.steps li b{color:var(--tx)}
@media (min-width:700px){html{font-size:17px}}
</style>
</head>

/* ---------- utilita' ---------- */

/* PIN personale: nell'app e nel database c'è solo l'hash (PBKDF2-SHA256, salato con codice gruppo + collega), mai il PIN in chiaro */
async function hashPin(pin, gid, mid){
  if(!(window.crypto && crypto.subtle)) throw new Error('crypto-assente');
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(String(pin)), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode('armieri:' + gid + ':' + mid), iterations: 100000}, key, 256);
  return Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2, '0')).join('');
}
const pinOk = v => /^\d{6}$/.test(String(v || ''));
const errIngresso = (e, permesso) => {
  const c = (e && (e.code || e.message)) || '';
  if(e && e.message === 'crypto-assente') return 'Apri l\'app da https o da localhost per usare il PIN';
  if(!navigator.onLine || /unavailable|network|offline|deadline/i.test(c)) return 'Connessione assente o instabile: riprova tra poco';
  if(/permission/i.test(c)) return permesso || 'Operazione non consentita';
  return 'Errore (' + errMsg(e) + ')';
};
const pinErr = e => e && e.message === 'crypto-assente' ? 'Apri l\'app da https o da localhost per usare il PIN' : /permission/i.test((e && (e.code || e.message)) || '') ? 'PIN non accettato' : 'Errore (' + errMsg(e) + ')';
const eur = c => (c < 0 ? '-' : '') + (Math.abs(c||0)/100).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
const eurS = c => (c > 0 ? '+' : '') + eur(c);
function parseEuro(v){
  if(v == null) return NaN;
  const s = String(v).trim().replace(/\s|€/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',', '.');
  if(!/^-?\d+(\.\d{0,2})?$/.test(s)) return NaN;
  return Math.round(parseFloat(s) * 100);
}
const pad = n => String(n).padStart(2,'0');
function dataOra(ms){ const d = new Date(ms); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function quando(ms){
  if(!ms) return '';
  const diff = Date.now() - ms, d = new Date(ms), oggi = new Date();
  if(diff < 60000) return 'ora';
  if(diff < 3600000) return Math.floor(diff/60000) + ' min fa';
  const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if(d.toDateString() === oggi.toDateString()) return 'oggi ' + hm;
  const ieri = new Date(oggi); ieri.setDate(oggi.getDate()-1);
  if(d.toDateString() === ieri.toDateString()) return 'ieri ' + hm;
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}` + (d.getFullYear() !== oggi.getFullYear() ? '/'+String(d.getFullYear()).slice(2) : '') + ' ' + hm;
}
function clean(o){ const r = {}; for(const k in o){ if(o[k] !== undefined) r[k] = o[k]; } return r; }
function add(o, k, v){ o[k] = (o[k] || 0) + v; }
function newCode(){
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', b = new Uint8Array(12);
  crypto.getRandomValues(b);
  const s = Array.from(b, x => A[x % A.length]).join('');
  return s.slice(0,4) + '-' + s.slice(4,8) + '-' + s.slice(8,12);
}
function normCode(v){
  const s = String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(s.length !== 12) return null;
  return s.slice(0,4) + '-' + s.slice(4,8) + '-' + s.slice(8,12);
}
const anno = () => String(new Date().getFullYear());
const oggiISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const FONTI = {contanti:'Contanti in sala', revolut:'Conto Revolut', tasca:'Di tasca propria'};
function errMsg(e){
  const c = (e && (e.code || e.message)) || String(e);
  if(/permission/i.test(c)) return 'permesso negato';
  if(/unavailable|network|offline/i.test(c)) return 'nessuna connessione';
  return c;
}

/* ---------- stato ---------- */
const st = {
  page: LS.get('page','bar'), vista: LS.get('vista','admin'), buste: [], uid: null, gid: LS.get('gid', null), mid: LS.get('mid', null),
  gruppo: null, membri: [], prodotti: [], eventi: [], chiusure: [], movimenti: [], pending: {},
  admins: [], utenti: [], isAdmin: false,
  ready: {}, sync: 'conn', syncErr: '', entry: null, busy: false,
  caffeQta: 1, riscSel: {}, riscMet: 'contanti', invSort: {k:'nome', asc:true}, feedFiltro: 'tutti', statPeriodo: 'corrente', salPer: 'mese', rpPer: 'oggi', rpDa: '', rpA: '', salDa: '', salA: '', scSel: null, listaSpesa: [], spesaSel: {}, arcMov: null, arcLoading: false,
  archivio: null, skipInstall: false, installata: false
};

/* ---------- Firebase ---------- */
let db = null, unsubs = [], movUnsub = null, movUnsubD = null, lastCutoffKey = null;
const TS = () => firebase.firestore.FieldValue.serverTimestamp();
const G = () => db.collection('saletta').doc(st.gid);
const C = n => G().collection(n);

function initFirebase(){
  const cfgOk = FIREBASE_CONFIG && (FIREBASE_CONFIG.demo || (FIREBASE_CONFIG.apiKey && !/INCOLLA|YOUR_|XXXX/i.test(FIREBASE_CONFIG.apiKey + (FIREBASE_CONFIG.projectId || ''))));
  if(!cfgOk || typeof firebase === 'undefined'){ st.sync = 'nocfg'; render(); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  db.enablePersistence({synchronizeTabs: true}).catch(() => {});
  firebase.auth().onAuthStateChanged(u => {
    if(!u) return;
    st.uid = u.uid;
    if(st.gid) connect(st.gid); else { st.sync = 'ok'; render(); }
  });
  firebase.auth().signInAnonymously().catch(e => { st.sync = 'err'; st.syncErr = e.code || e.message; render(); });
}

function onErr(e){ console.error(e); st.sync = 'err'; st.syncErr = e.code || e.message; render(); }
function setSync(s){
  if(!s || !s.metadata) return;
  st.sync = s.metadata.fromCache ? (navigator.onLine ? 'conn' : 'off') : 'ok';
}

function disconnect(){
  unsubs.forEach(u => u()); unsubs = [];
  stopData();
  modeKey = null;
  _derCache = null;
  Object.assign(st, {pinDoc:undefined, gruppo:null, membri:[], prodotti:[], eventi:[], chiusure:[], estratto:null, movimenti:[], pending:{}, admins:[], utenti:[], richiesta:null, richieste:[], reqAdmin:null, richAdmin:[], riscatti:[], acquisti:[], buste:[], listaSpesa:[], spesaSel:{}, movD:[], fab:false, isAdmin:false, ready:{}, archivio:null});
}

function connect(gid){
  disconnect();
  st.gid = gid;
  const g = db.collection('saletta').doc(gid);
  const docs = s => s.docs.map(d => ({id: d.id, ...d.data({serverTimestamps:'estimate'})}));
  // includeMetadataChanges: senza, dopo il primo snapshot dalla cache lo stato restava grigio finché i dati non cambiavano
  unsubs.push(g.onSnapshot({includeMetadataChanges: true}, s => {
    if(!s.exists){
      if(!s.metadata.fromCache){ toast('Il gruppo non esiste più su questo codice', 'err'); A['esci-gruppo'](true); }
      return;
    }
    st.gruppo = {id: s.id, ...s.data()}; st.ready.g = true; setSync(s); render();
  }, onErr));
  unsubs.push(g.collection('richieste').doc(st.uid).onSnapshot(s => {
    st.richiesta = s.exists ? s.data() : null; st.ready.r = true; render();
  }, onErr));
  unsubs.push(g.collection('richiesteAdmin').doc(st.uid).onSnapshot(s => { st.reqAdmin = s.exists ? s.data() : null; render(); }, () => {}));
  unsubs.push(g.collection('utenti').doc(st.uid).onSnapshot(s => {
    if(s.exists){ st.mid = s.data().mid; LS.set('mid', st.mid); }
    else if(!s.metadata.fromCache){ st.mid = null; LS.del('mid'); }
    st.ready.u = true;
    if(!s.metadata.hasPendingWrites) syncMode();   // aspetta che il server abbia registrato il collegamento telefono → collega
    render();
  }, onErr));
  unsubs.push(g.collection('admin').doc(st.uid).onSnapshot(s => {
    const era = st.isAdmin;
    st.isAdmin = s.exists && !s.metadata.hasPendingWrites ? true : (s.exists && era);
    if(!s.exists) st.isAdmin = false;
    st.ready.a = true; syncMode(); render();
  }, onErr));
}

/* Dati riservati: l'amministratore scarica registro, chiusure e anagrafica telefoni;
   il collega scarica solo i propri movimenti e il proprio estratto (saldo all'ultima chiusura). */
let dataUnsubs = [], modeKey = null;
function stopData(){
  sondStop();
  dataUnsubs.forEach(u => u()); dataUnsubs = [];
  if(movUnsub){ movUnsub(); movUnsub = null; }
  if(movUnsubD){ movUnsubD(); movUnsubD = null; }
  lastCutoffKey = null;
  if(perleUnsub){ perleUnsub(); perleUnsub = null; } perleKey = '';
}
let retryT = null, retryN = 0;
const onDataErr = e => {
  if(!/permission/i.test(e.code || e.message)) return onErr(e);
  // di solito succede durante un cambio di ruolo o appena scelto il nome: riprova qualche volta
  console.warn('permesso negato, riprovo', e);
  clearTimeout(retryT);
  if(retryN++ < 5) retryT = setTimeout(() => { modeKey = null; syncMode(); render(); }, 1500 * retryN);
};
function syncMode(){
  if(!st.ready.a || !st.ready.u) return;
  const key = st.isAdmin ? 'admin' : (st.mid ? 'user:' + st.mid : 'none');
  if(key === modeKey) return;
  modeKey = key;
  if(key === 'admin' || key.startsWith('user')) setTimeout(() => { if(modeKey === key) retryN = 0; }, 20000);
  stopData();
  Object.assign(st, {pinDoc:undefined, chiusure:[], estratto:null, movimenti:[], movD:[], riscatti:[], acquisti:[], buste:[], listaSpesa:[], admins:[], utenti:[], richieste:[], richAdmin:[], archivio:null, arcMov:null, arcLoading:false});
  st.ready.mv = false; _derCache = null;
  if(key === 'none'){ Object.assign(st, {membri:[], prodotti:[], eventi:[]}); st.ready.m = false; return; }
  // dati comuni, leggibili solo da chi è già stato accettato nel gruppo
  const docs = s => s.docs.map(d => ({id: d.id, ...d.data({serverTimestamps:'estimate'})}));
  dataUnsubs.push(C('membri').onSnapshot(s => { st.membri = docs(s).sort((a,b) => a.nome.localeCompare(b.nome, 'it')); st.ready.m = true; render(); }, onDataErr));
  if(st.mid) dataUnsubs.push(C('segretiMembri').doc(st.mid).onSnapshot(s => {   // PIN personale: serve solo sapere se esiste ed è temporaneo
    if(s.exists) st.pinDoc = {temporaneo: s.data().temporaneo === true};
    else if(!s.metadata.fromCache) st.pinDoc = null;
    render();
  }, () => {}));
  dataUnsubs.push(C('prodotti').onSnapshot(s => { st.prodotti = docs(s); render(); }, onDataErr));
  let evA = [], evB = [];   // compleanni (ricorrenti) + ultimi 30 per data: mai l'intera collezione
  const evMerge = () => { const mp = new Map(); evA.concat(evB).forEach(e => mp.set(e.id, e)); st.eventi = [...mp.values()]; render(); };
  dataUnsubs.push(C('eventi').where('tipo', '==', 'compleanno').limit(30).onSnapshot(s => { evA = docs(s); evMerge(); }, onDataErr));
  dataUnsubs.push(C('eventi').orderBy('data', 'desc').limit(30).onSnapshot(s => { evB = docs(s); evMerge(); }, onDataErr));
  // lista della spesa: articoli da comprare / in rimborso, più gli ultimi 30 acquistati (nessun indice composito)
  let lsAtt = [], lsSto = [];
  const lsMerge = () => { st.listaSpesa = lsAtt.concat(lsSto); render(); };
  dataUnsubs.push(C('listaSpesa').where('stato', 'in', ['da_comprare', 'in_rimborso']).onSnapshot(s => { lsAtt = docs(s); lsMerge(); }, onDataErr));
  dataUnsubs.push(C('listaSpesa').orderBy('acquistoTs', 'desc').limit(30).onSnapshot(s => { lsSto = docs(s).filter(x => x.stato === 'acquistato'); lsMerge(); }, onDataErr));
  if(key === 'admin'){
    dataUnsubs.push(C('chiusure').orderBy('fino').onSnapshot(s => {
      st.chiusure = s.docs.map(d => ({id: d.id, ...d.data()})); _derCache = null;
      const last = ultimaChiusura(), k = last ? last.id : '-';
      if(k !== lastCutoffKey){ lastCutoffKey = k; subMovimenti(last ? last.fino : firebase.firestore.Timestamp.fromMillis(0), null); }
      render();
    }, onDataErr));
    dataUnsubs.push(C('admin').onSnapshot(s => { st.admins = s.docs.map(d => ({id: d.id, ...d.data({serverTimestamps:'estimate'})})); render(); }, onDataErr));
    dataUnsubs.push(C('utenti').onSnapshot(s => { st.utenti = s.docs.map(d => ({id: d.id, ...d.data()})); render(); }, onDataErr));
    dataUnsubs.push(C('richiesteAdmin').onSnapshot(s => { st.richAdmin = s.docs.map(d => ({id: d.id, ...d.data({serverTimestamps:'estimate'})})).filter(r => r.stato === 'attesa'); render(); }, onDataErr));
    dataUnsubs.push(C('richieste').onSnapshot(s => { st.richieste = s.docs.map(d => ({id: d.id, ...d.data({serverTimestamps:'estimate'})})).filter(r => r.stato === 'attesa'); render(); }, onDataErr));
  } else if(st.mid){
    const mid = st.mid;
    dataUnsubs.push(C('estratti').doc(mid).onSnapshot(s => {
      st.estratto = s.exists ? s.data() : null; _derCache = null;
      const k = st.estratto ? st.estratto.chiusura : '-';
      if(k !== lastCutoffKey){ lastCutoffKey = k; subMovimenti(st.estratto ? st.estratto.fino : firebase.firestore.Timestamp.fromMillis(0), mid); }
      render();
    }, onDataErr));
  }
}

function subMovimenti(cutoff, mid){
  if(movUnsub) movUnsub();
  if(movUnsubD){ movUnsubD(); movUnsubD = null; }
  st.ready.mv = false; st.movD = [];
  mid = null;   // registro trasparente: tutti i membri leggono tutti i movimenti
  if(mid){   // scambi di crediti indirizzati a me
    movUnsubD = C('movimenti').where('dest', '==', mid).where('ts', '>', cutoff).orderBy('ts').onSnapshot(s => {
      st.movD = s.docs.map(d => { const x = d.data({serverTimestamps:'estimate'}); return {id: d.id, ...x, _ts: x.ts || null, t: x.ts ? x.ts.toMillis() : (x.cts || Date.now()), _local: d.metadata.hasPendingWrites}; });
      _derCache = null; render();
    }, onDataErr);
  }
  let q = C('movimenti');
  if(mid) q = q.where('mid', '==', mid);
  movUnsub = q.where('ts', '>', cutoff).orderBy('ts').onSnapshot(s => {
    st.movimenti = s.docs.map(d => {
      const x = d.data({serverTimestamps:'estimate'});
      return {id: d.id, ...x, _ts: x.ts || null, t: x.ts ? x.ts.toMillis() : (x.cts || Date.now()), _local: d.metadata.hasPendingWrites};
    });
    for(const id of Object.keys(st.pending)) if(st.movimenti.some(m => m.id === id)) delete st.pending[id];
    st.ready.mv = true; _derCache = null; render();
  }, onDataErr);
}

window.addEventListener('online', () => { if(st.sync === 'off') st.sync = 'conn'; render(); });
window.addEventListener('offline', () => { st.sync = 'off'; render(); });

/* ---------- dati derivati ---------- */
const ultimaChiusura = () => st.chiusure.length ? st.chiusure[st.chiusure.length - 1] : null;
function tuttiMov(){
  const ids = new Set(st.movimenti.map(m => m.id));
  const extra = st.movD.filter(m => !ids.has(m.id)); extra.forEach(m => ids.add(m.id));
  return st.movimenti.concat(extra, Object.values(st.pending).filter(p => !ids.has(p.id))).sort((a,b) => a.t - b.t);
}
function emptyState(){ return {saldi:{}, cassa:{contanti:0, revolut:0}, stock:{}, turni:{}, ultimo:{}, punti:{}, puntiConv:{}, pcaf:{}, pcafConv:{}, pspesa:{}, pbf:{}, pRisc:{}, quote:{}, dovute:{}}; }
const METODI_QUOTA = {contanti:'Contanti', revolut:'Revolut', credito:'Dal credito', esterno:'Già versata'};
function emptyStats(){ return {caffe:{}, snack:{}, euroMid:{}, spese:0, ricariche:0, n:0}; }

function applyMov(S, m, sg){
  sg = sg || 1;
  switch(m.tipo){
    case 'caffe': if(m.stato !== 'annullata'){ add(S.saldi, m.mid, -sg*m.importo); add(S.pcaf, m.mid, sg*(m.pt ?? m.qta)*fx(m)); } break;
    case 'snack': if(m.stato !== 'annullata'){ add(S.saldi, m.mid, -sg*m.importo); add(S.stock, m.pid, -sg*m.qta); add(S.pcaf, m.mid, sg*(m.pt ?? 0)*fx(m)); } break;   // punti snack nel monte "consumi" (pcaf); senza pt (vecchi acquisti) = 0
    case 'ricarica': if(m.stato === 'confermata'){ add(S.saldi, m.mid, sg*m.importo); add(S.cassa, m.metodo, sg*m.importo); } break;
    case 'spesa':
      if(m.stato === 'confermata'){
        S.pspesa = S.pspesa || {}; add(S.pspesa, m.mid, sg*(m.pt ?? PUNTI_SPESA)*fx(m));   // 2 punti per ogni richiesta convalidata, qualunque sia il numero di articoli
        if(m.fonte === 'tasca') add(S.saldi, m.mid, sg*m.importo); else if(m.fonte === 'contanti' || m.fonte === 'revolut') add(S.cassa, m.fonte, -sg*m.importo);
      } break;
    case 'uscita': add(S.cassa, m.fonte, -sg*m.importo); break;
    case 'entrata': add(S.cassa, m.fonte, sg*m.importo); break;
    case 'giroconto': add(S.cassa, m.da, -sg*m.importo); add(S.cassa, m.a, sg*m.importo); break;
    // quota annua: l'addebito abbassa il saldo; il pagamento lo riporta su e (se in contanti/Revolut) entra in cassa
    case 'addebito_quota': add(S.saldi, m.mid, -sg*m.importo); S.dovute[m.anno] = S.dovute[m.anno] || {}; add(S.dovute[m.anno], m.mid, sg); break;
    case 'quota':
      S.quote[m.anno] = S.quote[m.anno] || {}; add(S.quote[m.anno], m.mid, sg);
      if(typeof m.cred === 'boolean'){
        // modello prepagato: la quota e' un contributo al fondo; i crediti si accreditano solo se l'admin lo sceglie (cred)
        if(m.metodo === 'contanti' || m.metodo === 'revolut') add(S.cassa, m.metodo, sg*m.importo);

    case 'regalo': add(S.saldi, m.daMid, -sg*m.importo); add(S.saldi, m.aMid, sg*m.importo); break;

    case 'riscatto_punti': S.pRisc = S.pRisc || {}; add(S.pRisc, m.mid, sg*m.punti*fx(m)); add(S.saldi, m.mid, sg*m.importo); break;

    case 'rettifica': add(S.saldi, m.mid, sg*m.importo); break;

      if(m.qmAnno){ S.dovute[m.qmAnno] = S.dovute[m.qmAnno] || {}; add(S.dovute[m.qmAnno], m.mid, -sg); }   // storno di un vecchio addebito di quota

    case 'carico': add(S.stock, m.pid, sg*m.qta); break;

    case 'obiettivo': if(m.fase === 'fatto'){ add(S.turni, m.mid, sg); add(S.punti, m.mid, sg*(m.punti || 0)); if(sg > 0) S.ultimo[m.mid] = Math.max(S.ultimo[m.mid] || 0, m.t || 0); } break;   // il «carico» non assegna nulla: i punti arrivano alla conferma
    case 'compito': if(m.stato === 'confermata'){ add(S.turni, m.mid, sg); add(S.punti, m.mid, sg*(m.punti || 0)); if(sg > 0) S.ultimo[m.mid] = Math.max(S.ultimo[m.mid] || 0, m.t || 0); } break;   // i punti arrivano solo alla convalida dell'admin

/* ---------- installazione dell'app (PWA) ----------
   Browser e app installata conservano i dati separati: chi si registra dal browser e poi installa
   l'app si ritrova da capo. Per questo, finché non è registrato, chi apre l'app dal browser
   vede prima le istruzioni di installazione. */
const isStandalone = () => {
  try {
    return ['standalone', 'fullscreen', 'minimal-ui'].some(m => window.matchMedia('(display-mode: ' + m + ')').matches)
      || window.navigator.standalone === true || document.referrer.startsWith('android-app://');
  } catch(e){ return false; }
};
const piattaforma = () => {
  const ua = navigator.userAgent || '';
  if(/iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return 'ios';
  if(/Android/i.test(ua)) return 'android';
  return 'desktop';
};
const serveInstall = () => !st.gid && !st.skipInstall && !isStandalone();
let installPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; render(); });
window.addEventListener('appinstalled', () => { installPrompt = null; st.installata = true; render(); });
const appUrl = () => location.origin + location.pathname.replace(/index\.html$/, '');

  if(serveInstall()) return entryInstall();

  if(st.entry === 'recupero') return entryRecupero();

  if(!st.gid) return st.entry === 'crea' ? entryCrea() : st.entry === 'creatore' && st.joinCode ? entryCreatore() : st.entry === 'join' ? entryJoin() : entryWelcome();

  if(st.mid) return `<div class="spin"></div><p class="mut" style="text-align:center">Accesso approvato, carico i dati…</p>`;
  return entryRichiesta();
}

/* ---------- tesoreria / home amministratore ---------- */
const fondoNoto = () => st.isAdmin || !st.estratto || !!st.estratto.cassa;
function tesoro(d){
  const c = d.S.cassa || {contanti:0, revolut:0};
  const cassa = (c.contanti || 0) + (c.revolut || 0);
  let cred = 0, deb = 0;
  Object.keys(d.S.saldi).forEach(k => { const v = d.S.saldi[k] || 0; if(v > 0) cred += v; else deb += -v; });
  return {cassa, cont: c.contanti || 0, rev: c.revolut || 0, cred, deb, netto: cassa - cred + deb};
}

/* ---------- registro movimenti, notifiche ---------- */
const tms = x => x && x.toMillis ? x.toMillis() : (typeof x === 'number' ? x : 0);
function saldoDisp(d){ const s = d.S.saldi[st.mid] || 0; return s > 0 ? creditoLibero() : s; }
function pRegistro(d){ return pFeed(d); }
/* storico delle richieste gia' decise (accettate, rifiutate, annullate): solo dati gia' in memoria, nessuna lettura in piu' */
function storicoRichieste(d){
  const me = st.mid, adm = adminView(), N = st.storicoN || 30;
  const src = (adm && st.arcMov ? st.arcMov : []).concat(d.movs);
  const st_ = new Set(src.filter(m => m.tipo === 'storno').map(m => m.rif));
  const list = src.filter(m => ['spesa', 'ricarica', 'riscatto', 'scambio'].includes(m.tipo) && ['confermata', 'rifiutata', 'annullata'].includes(m.stato) && (adm || [m.mid, m.dest, m.daMid, m.aMid].includes(me)))
    .map(m => ({m, t: tms(m.esitoTs) || m.t || 0})).sort((a, b) => b.t - a.t);
  const righe = list.slice(0, N).map(({m, t}) => { const x = descMov(m);
    const pill = m.stato === 'confermata' ? (st_.has(m.id) ? '<span class="pill red">stornata</span>' : '<span class="pill green">accettata</span>') : m.stato === 'rifiutata' ? '<span class="pill red">rifiutata</span>' : '<span class="pill mut">annullata</span>';
    return `<div class="li"><div class="av">${x.ic}</div><div class="grow"><div class="t" style="white-space:normal;font-size:13.5px">${x.t}</div><div class="d">${quando(t)}${m.esitoDa ? ' · da ' + esc(m.esitoDa) : ''}</div></div>${pill}</div>`; }).join('');
  return `<div class="card" id="storico-richieste"><h3><span>${ic('clock','s')} Storico richieste</span><span class="mut" style="font-size:11px;text-transform:none;letter-spacing:0">${list.length}</span></h3>
    ${list.length ? `<div class="list">${righe}</div>` : '<div class="empty">Nessuna richiesta accettata o rifiutata.</div>'}
    ${list.length > N ? `<button class="btn sm block ghost" style="margin-top:8px" data-act="storico-altre">Mostra altre ${Math.min(30, list.length - N)}</button>` : ''}
    ${adm ? (st.arcMov ? '<p class="hint" style="margin:8px 0 0">Il dettaglio dei periodi chiusi è incluso.</p>' : `<button class="btn sm block ghost" style="margin-top:8px" data-act="carica-arc-mov" ${st.arcLoading ? 'disabled' : ''}>${st.arcLoading ? 'Carico…' : 'Includi i periodi chiusi (legge l\'archivio)'}</button>`) : '<p class="hint" style="margin:8px 0 0">Mostra le richieste dall\'ultima chiusura di periodo.</p>'}</div>`;
}
const notifSeen = () => LS.get('notifSeen_' + st.mid, 0);
function notifiche(d){
  const me = st.mid, out = [];
  if(!me || !d) return out;
  d.movs.forEach(m => {
    const t = tms(m.esitoTs) || m.t || 0, ok = m.stato === 'confermata';
    if(m.tipo === 'spesa' && m.mid === me && m.esitoDa && (ok || m.stato === 'rifiutata')) out.push({t, e: ok ? '✅' : '❌', x: `La tua spesa «${esc(m.descr || '')}» (${eur(m.importo)}) è stata ${ok ? 'approvata' : 'rifiutata'}`});
    else if(m.tipo === 'ricarica' && m.mid === me && m.esitoDa && (ok || m.stato === 'rifiutata')) out.push({t, e: ok ? '✅' : '❌', x: `Il tuo pagamento di ${eur(m.importo)} è stato ${ok ? 'approvato' : 'rifiutato'}`});
    else if(m.tipo === 'accredito' && m.mid === me) out.push({t, e: '🎁', x: `Accredito ricevuto: ${eur(m.importo)} di crediti${m.causale ? ' · ' + esc(m.causale) : ''}`});
    else if(m.tipo === 'conversione' && m.mid === me) out.push({t, e: '🔄', x: `Hai convertito ${m.punti} Punti Pulizia in ${eur(m.importo)} di crediti`});
    else if(m.tipo === 'conversione_caffe' && m.mid === me) out.push({t, e: '☕', x: `Hai riscattato ${m.punti} Punti Caffè in ${eur(m.importo)} di crediti`});
    else if(m.tipo === 'riscatto' && m.mid === me && (ok || m.stato === 'rifiutata' || !m.stato)) out.push({t, e: m.stato === 'rifiutata' ? '❌' : '🏦', x: m.stato === 'rifiutata' ? `La tua richiesta di riscatto di ${eur(m.importo)} è stata rifiutata` : `Il Fondo Gruppo ti ha liquidato ${eur(m.importo)}`});
    else if(m.tipo === 'ben_fatto' && m.aMid === me) out.push({t, e: '👏', x: `${esc(nomeM(m.daMid))} ti dice «Ben fatto!»: «${esc(m.msg || '')}» ${(m.pt ?? 2) ? `(+${(m.pt ?? 2) * fx(m)} punti)` : ''}`});
    else if(m.tipo === 'riscatto_punti' && m.mid === me) out.push({t, e: '⭐', x: `Hai riscattato ${m.punti * fx(m)} punti: +${eur(m.importo)} di crediti`});
    else if(m.tipo === 'regalo' && m.aMid === me) out.push({t, e: m.trasf ? '🤝' : '🎁', x: `${esc(nomeM(m.daMid))} ti ha ${m.trasf ? 'ceduto' : 'regalato'} ${eur(m.importo)} di crediti${m.msg ? ' · «' + esc(m.msg) + '»' : ''}`});
    else if(m.tipo === 'compito' && m.mid === me){
      const nm = esc(m.nome || 'Compito');
      if(m.stato === 'confermata') out.push({t, e: '✅', x: `Compito «${nm}» convalidato: +${m.punti || 0} punti`});
      else if(m.stato === 'rifiutata') out.push({t, e: '❌', x: `Compito «${nm}» non convalidato: nessun punto`});
      else if(m.stato === 'annullata') out.push({t, e: '↩️', x: `L'incarico «${nm}» è stato annullato da un admin`});
      else out.push({t: m.t || 0, e: '🎯', x: `Ti è stato assegnato il compito «${nm}» (+${m.punti || 0} punti)`});
    }
    else if(m.tipo === 'scambio'){
      if(m.stato === 'confermata' && m.daMid === me) out.push({t, e: '🤝', x: `${esc(nomeM(m.aMid))} ha comprato ${eur(m.importo)} dei tuoi crediti`});
      else if(m.stato === 'confermata' && m.aMid === me) out.push({t, e: '🤝', x: `Hai ricevuto ${eur(m.importo)} di crediti da ${esc(nomeM(m.daMid))}: ricezione confermata`});
      else if(m.stato === 'rifiutata' && m.mid === me) out.push({t, e: '❌', x: `${esc(nomeM(m.dest))} ha rifiutato lo scambio di ${eur(m.importo)}`});
    }
  });
  return out.sort((a, b) => b.t - a.t).slice(0, 40);
}
/* ---------- giacenze (copia pubblica, aggiornata dagli admin) ---------- */
const giacSent = {};
/* i colleghi calcolano il Totale Fondo dall'estratto: l'admin completa gli estratti vecchi con saldi e cassa dell'ultima chiusura */
let estrSent = '';
function sincronizzaEstratti(){
  const last = ultimaChiusura();
  if(!st.isAdmin || st.sync !== 'ok' || modeKey !== 'admin' || !last || !last.stato || estrSent === last.id) return;
  estrSent = last.id;
  const ls = last.stato, mp = {};
  ['pcaf','pcafConv','punti','puntiConv','turni','ultimo','pspesa','pbf','pRisc'].forEach(k => { mp[k] = ls[k] || {}; });
  mp.bf = last.bf || {};
  const dati = {saldi: ls.saldi || {}, cassa: ls.cassa || {contanti:0, revolut:0}, mp, sc: last.sc ? 1 : 0, storico: storicoDaChiusure()};
  st.membri.forEach(m => C('estratti').doc(m.id).update(dati).catch(() => {}));
}
function sincronizzaGiacenze(d){
  if(!st.isAdmin || st.sync !== 'ok' || !st.ready.mv || modeKey !== 'admin') return;
  st.prodotti.forEach(p => {
    const v = d.S.stock[p.id] || 0, k = p.id + ':' + v;
    if(p.giacenza !== v && !giacSent[k]){ giacSent[k] = 1; C('prodotti').doc(p.id).set({giacenza: v}, {merge: true}).catch(() => { delete giacSent[k]; }); }
  });
}
const giacenza = (d, p) => st.isAdmin ? (d.S.stock[p.id] || 0) : (typeof p.giacenza === 'number' ? p.giacenza : 1);

/* buste di caffe' in scorta = buste caricate dall'admin (articolo speciale 'caffe'); nessuna apertura manuale */
const prodCaffe = () => prodotto(PID_CAFFE);
function busteCaricate(d){
  const p = prodCaffe(); if(!p) return 0;
  return st.isAdmin ? (d.S.stock[p.id] || 0) : (typeof p.giacenza === 'number' ? p.giacenza : 0);
}
const busteDisp = d => Math.max(0, busteCaricate(d));
/* ---------- descrizione movimenti ---------- */
function descMov(m){
  const n = esc(nomeM(m.mid));
  switch(m.tipo){
    case 'caffe': return {ic:'☕', t: m.qta > 1 ? `${n} ha offerto un giro di ${m.qta} caffè` : `${n} ha preso un caffè`, a: -m.importo};
    case 'caffe_pagato': return {ic:'☕', t: `${n} ha pagato ${m.qta > 1 ? m.qta + ' caffè' : 'un caffè'} subito${m.metodo === 'contanti' || m.metodo === 'revolut' ? ' · ' + FONTI[m.metodo] : ''}`, a: 0, cassa: m.metodo === 'contanti' || m.metodo === 'revolut'};
    case 'snack': { const p = prodotto(m.pid); return {ic: esc((p && p.emoji) || m.emoji || '🍫'), t: `${n} ha preso ${m.qta > 1 ? m.qta + ' × ' : ''}${esc((p && p.nome) || m.nome || 'snack')}`, a: -m.importo}; }
    case 'ricarica': return {ic:'💰', t: `${m.fondo ? 'Quota fondo' : 'Ricarica crediti'} da ${n} · ${FONTI[m.metodo] || m.metodo}`, a: m.importo, cassa: true};
    case 'scambio': return m.aMid === m.mid
      ? {ic:'🤝', t: `${esc(nomeM(m.aMid))} compra ${eur(m.importo)} di crediti da ${esc(nomeM(m.daMid))} (paga fuori dall'app)`, a: 0, neutro: m.importo}
      : {ic:'🔄', t: `${esc(nomeM(m.daMid))} vende ${eur(m.importo)} di crediti a ${esc(nomeM(m.aMid))}${m.causale ? ': ' + esc(m.causale) : ''}`, a: 0, neutro: m.importo};
    case 'regalo': { const msg = m.msg ? ` · «${esc(m.msg)}»` : '', io = !adminView();
      return {ic: m.trasf ? '🤝' : '🎁', t: `${esc(nomeM(m.daMid))} ${m.trasf ? 'ha ceduto (scambio)' : 'ha regalato'} ${eur(m.importo)} a ${esc(nomeM(m.aMid))}${msg}`, ...(io && m.daMid === st.mid ? {a: -m.importo} : io && m.aMid === st.mid ? {a: m.importo} : {a: 0, neutro: m.importo})}; }
    case 'ben_fatto': return {ic:'👏', t: `${esc(nomeM(m.daMid))} dice «Ben fatto!» a ${esc(nomeM(m.aMid))}: «${esc(m.msg || '')}» ${(m.pt ?? 2) ? `(+${(m.pt ?? 2) * fx(m)} punti)` : ''}`, a: 0};
    case 'riscatto_punti': return {ic:'⭐', t: `${n} riscatta ${m.punti * fx(m)} Punti Collega Modello`, a: m.importo};
    case 'riscatto': return {ic:'🏦', t: `Riscatto di ${n} · ${m.stato === 'attesa' ? 'richiesto al Fondo' : 'pagato dalla cassa'} (${FONTI[m.metodo] || m.metodo})`, a: -m.importo, cassa: true};
    case 'spesa': return {ic:'🧾', t: `Spesa di ${n}: ${esc(m.descr || '')} · ${m.fonte === 'denaro' ? 'rimborso in denaro' : m.fonte === 'tasca' ? 'rimborso in crediti' : 'pagata da ' + (FONTI[m.fonte] || m.fonte)}`, ...(m.fonte === 'tasca' ? {a: m.importo} : adminView() ? {a: -m.importo} : {a: 0, neutro: m.importo}), cassa: m.fonte !== 'tasca'};
    case 'uscita': return {ic:'💸', t: `Uscita: ${esc(m.causale || '')} · ${FONTI[m.fonte]}`, a: -m.importo, cassa: true};
    case 'entrata': return {ic:'📥', t: `Entrata: ${esc(m.causale || '')} · ${FONTI[m.fonte]}`, a: m.importo, cassa: true};
    case 'giroconto': return {ic:'🔁', t: `Giroconto ${FONTI[m.da]} → ${FONTI[m.a]}`, a: 0, neutro: m.importo, cassa: true};
    case 'quota': return typeof m.cred === 'boolean'
      ? {ic:'🛡️', t: `Quota ${esc(m.anno)} pagata da ${n} · ${METODI_QUOTA[m.metodo] || m.metodo} · ${m.cred ? 'accreditata anche come crediti' : 'solo contributo al fondo'}`, a: m.cred ? m.importo : 0, cassa: ['contanti','revolut'].includes(m.metodo)}
      : {ic:'🛡️', t: `Quota ${esc(m.anno)} pagata da ${n} · ${METODI_QUOTA[m.metodo] || m.metodo}`, a: ['contanti','revolut','esterno'].includes(m.metodo) ? m.importo : 0, cassa: ['contanti','revolut'].includes(m.metodo)};
    case 'addebito_quota': return {ic:'🧾', t: `Quota fondo ${esc(m.anno)} addebitata a ${n}`, a: -m.importo};
    case 'accredito': return {ic:'🎁', t: `Credito accreditato a ${n}${m.causale ? ': ' + esc(m.causale) : ''}`, a: m.importo};
    case 'rettifica': return {ic:'✏️', t: `Rettifica saldo di ${n}${m.causale ? ': ' + esc(m.causale) : ''}`, a: m.importo};
    case 'carico': { const p = prodotto(m.pid);
      if(m.pid === PID_CAFFE) return {ic:'📦', t: `Buste di caffè ${m.qta > 0 ? '+' : ''}${m.qta}`, a: 0};
      return {ic:'📦', t: `Giacenza ${esc((p && p.nome) || m.nome || '')} ${m.qta > 0 ? '+' : ''}${m.qta} pz`, a: 0}; }
    case 'compito': { const o = esc(m.nome || 'Compito'), c = esc(nomeM(m.mid)); return {ic:'🎯', t: m.stato === 'confermata' ? `Compito svolto e convalidato: ${o} · ${c} (+${m.punti || 0} punti)` : m.stato === 'attesa' ? `Compito svolto, da convalidare: ${o} · ${c} (+${m.punti || 0} punti)` : `Compito assegnato: ${o} · ${c}`, a: 0}; }
    case 'obiettivo': { const o = esc(m.nome || 'Obiettivo'); return {ic:'🎯', t: m.fase === 'fatto' ? `Obiettivo completato: ${o} · ${esc(nomeM(m.mid))} (+${m.punti || 0} punti)` : `Obiettivo preso in carico: ${o} · ${esc(nomeM(m.mid))}`, a: 0}; }
    case 'pulizia': { const lab = {macc: 'Pulizia macchinetta', secchio: 'Secchio svuotato', sala: 'Pulizia generale'}[m.task] || 'Pulizie'; return {ic:'✨', t: `${lab}: ${(m.mids||[]).map(x => esc(nomeM(x))).join(', ')} (+${ptPulM(m)} punti a testa)`, a: 0}; }
    case 'conversione': return {ic:'🔄', t: `${n} converte ${m.punti} Punti Pulizia in crediti`, a: m.importo};
    case 'conversione_caffe': return {ic:'☕', t: `${n} converte ${m.punti} Punti Caffè in crediti`, a: m.importo};
    case 'punti_adj': return {ic:'🏅', t: `Punti ${m.kind === 'caffe' ? 'Consumi' : 'Pulizia'} di ${n}: ${m.punti > 0 ? '+' : ''}${m.punti * fx(m)}${m.causale ? ' · ' + esc(m.causale) : ''}`, a: 0};
    case 'storno': { const o = m.orig ? descMov(m.orig) : {t:''}; return {ic:'↩️', t: `Storno di: ${o.t}`, a: o.a ? -o.a : 0, cassa: o.cassa}; }
  }
  return {ic:'•', t: m.tipo, a: 0};
}

function puoStornare(m, d){
  return st.isAdmin && !m._pending && m.tipo !== 'storno' && !d.stornati.has(m.id)
    && !['assegnato','attesa','rifiutata','annullata'].includes(m.stato);
}

function righeMov(list, d, opt){

      : m.stato === 'attesa' ? `<span class="pill amber">in attesa</span>`

      : m.stato === 'annullata' ? `<span class="pill mut">annullata</span>`
      : d.stornati.has(m.id) ? `<span class="pill red">stornato</span>` : '';
    const amt = x.neutro ? `<span class="tx2">${eur(x.neutro)}</span>` : x.a ? `<span class="${x.a > 0 ? 'green' : 'red'}">${eurS(x.a)}</span>` : '';
    const annullabile = !opt.noAct && m.uid === st.uid && ['caffe','snack'].includes(m.tipo) && !m.stato && !m._pending && !d.stornati.has(m.id) && Date.now() - m.t < ANNULLA_MIN*60000;
    const autore = m.autore && m.amid !== m.mid ? ` · da ${esc(m.autore)}` : '';

/* elenco del registro: filtro + ricerca per collega (nome o nickname) su tutti i colleghi coinvolti nel movimento */
const TIPI_ENTRATE = ['ricarica', 'entrata', 'quota', 'caffe_pagato'], TIPI_USCITE = ['spesa', 'uscita', 'riscatto'], TIPI_ALTRI = ['giroconto', 'storno', 'rettifica', 'accredito', 'addebito_quota', 'scambio', 'riscatto_punti', 'conversione', 'conversione_caffe'];
const FEED_ADM = [['tutti', 'Tutti'], ['entrate', 'Entrate'], ['uscite', 'Uscite'], ['altri', 'Giroconti & storni'], ['consumi', 'Consumi'], ['attesa', 'In attesa']];
function feedLista(d){
  const adm = st.isAdmin;
  const f = adm && !FEED_ADM.some(x => x[0] === st.feedFiltro) ? 'tutti' : st.feedFiltro, me = st.mid;
  const mio = m => m.mid === me || m.dest === me || m.daMid === me || m.aMid === me || (m.mids || []).includes(me);
  const cassaTipi = ['caffe_pagato','spesa','uscita','entrata','giroconto','ricarica','riscatto','quota','addebito_quota','accredito','rettifica'];
  let list = d.movs.slice().reverse();
  let rp = null;
  if(adm){
    rp = rpRange(st.rpPer);
    list = (st.arcMov || []).slice().reverse().concat(list).filter(m => m.t >= rp.da && m.t <= rp.a);
    if(f === 'entrate') list = list.filter(m => TIPI_ENTRATE.includes(m.tipo));
    if(f === 'uscite') list = list.filter(m => TIPI_USCITE.includes(m.tipo));
    if(f === 'altri') list = list.filter(m => TIPI_ALTRI.includes(m.tipo));
    if(f === 'consumi') list = list.filter(m => ['caffe', 'snack'].includes(m.tipo));
    if(f === 'attesa') list = list.filter(m => m.stato === 'attesa');
  } else {
    if(f === 'miei') list = list.filter(mio);
    if(f === 'bar') list = list.filter(m => ['caffe','snack'].includes(m.tipo));
    if(f === 'cassa') list = list.filter(m => descMov(m).cassa || cassaTipi.includes(m.tipo));

  const q = (st.feedQ || '').trim().toLowerCase();

    const nq = norm(q);
    const hit = id => { const m = id && membro(id); return !!m && norm(m.nome + ' ' + (m.nick || '')).includes(nq); };
    const txt = m => norm(String(descMov(m).t).replace(/<[^>]*>/g, ' ') + ' ' + [m.causale, m.descr, m.msg, ...(m.articoliNomi || [])].filter(Boolean).join(' '));
    list = list.filter(m => [m.mid, m.dest, m.daMid, m.aMid, ...(m.mids || []), m.orig && m.orig.mid].some(hit) || txt(m).includes(nq));
  }
  const info = q ? `${list.length} ${list.length === 1 ? 'movimento' : 'movimenti'} per «${esc(st.feedQ.trim())}»` : (adm ? `${list.length} ${list.length === 1 ? 'movimento' : 'movimenti'} · ${esc(rp.label)}` : '');

}
/* entrate/uscite di cassa del periodo dai movimenti gia' in memoria (storni inclusi) */
function cassaRange(r){
  const R = {inC: 0, inR: 0, spese: 0, uscite: 0, risc: 0};
  const inc = (met, v) => { if(met === 'revolut') R.inR += v; else if(met === 'contanti') R.inC += v; };
  const pass = (m, sg) => {
    switch(m.tipo){
      case 'ricarica': if(m.stato === 'confermata') inc(m.metodo, sg * m.importo); break;
      case 'quota': inc(m.metodo, sg * m.importo); break;
      case 'entrata': inc(m.fonte, sg * m.importo); break;
      case 'caffe_pagato': inc(m.metodo, sg * m.importo); break;
      case 'spesa': if(m.stato === 'confermata') R.spese += sg * m.importo; break;
      case 'uscita': R.uscite += sg * m.importo; break;
      case 'riscatto': if(m.stato === 'confermata' || !m.stato) R.risc += sg * m.importo; break;
      case 'storno': if(m.orig) pass(m.orig, -sg); break;
    }
  };
  (st.isAdmin && st.arcMov ? st.arcMov : []).concat(tuttiMov()).filter(m => m.t >= r.da && m.t <= r.a).forEach(m => pass(m, 1));
  return R;
}

  const keyOf = t => { const x = new Date(t); return g === 'ora' ? `${isoDi(x)}T${pad(x.getHours())}` : g === 'giorno' ? isoDi(x) : `${x.getFullYear()}-${pad(x.getMonth()+1)}`; };

    const k = keyOf(cur.getTime());
    const lab = g === 'ora' ? pad(cur.getHours()) : g === 'giorno' ? `${pad(cur.getDate())}/${pad(cur.getMonth()+1)}`
      : cur.toLocaleDateString('it-IT', {month: 'short'}) + (dueAnni ? ' ' + String(cur.getFullYear()).slice(2) : '');

}

function nuovoAgg(){ return {ptC:{}, ptP:{}, ptS:{}, ptB:{}, caffe:{}, snack:{}, euro:{}, spese:{}, speseN:{}, turni:{}, pPul:{}, regDati:{}, bfRic:{}, tot:{ric:0, quote:0, regali:0, regaliN:0, speseTot:0, speseCassa:0, riscatti:0, entrate:0, uscite:0, giro:0}}; }
function aggMov(G, m, sg){

    case 'obiettivo': if(m.fase === 'fatto'){ add(G.turni, m.mid, sg); add(G.pPul, m.mid, sg*(m.punti || 0)); add(G.ptP, m.mid, sg*(m.punti || 0)); } break;
    case 'ricarica': if(m.stato === 'confermata') t.ric += sg*m.importo; break;

  const mon = t => { const x = new Date(t); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x.getTime(); };
  list.forEach(m => {
    let src = m, sg = 1, t = m.t;
    if(m.tipo === 'storno'){ if(!m.orig) return; src = m.orig; sg = -1; t = m.orig.t >= lo ? m.orig.t : m.t; }
    const k = mon(t);
    fs.forEach((f, i) => { const v = f(src); if(v){ (w[k] = w[k] || [0, 0, 0, 0])[i] += sg * v; } });
  });

}
function aggConChiusi(d, r, slot){

/* ---------- Tasso di Onestà automatico: caffè registrati nel periodo ÷ (kg di caffè in grani acquistati nel periodo × 130) ---------- */
function kgCaffeSpesa(m){
  const parti = (m.articoliNomi && m.articoliNomi.length) ? m.articoliNomi : String(m.descr || '').split(/[,;+]/);
  let kg = 0;
  parti.forEach(p => {
    const t = String(p).toLowerCase();
    if(!/caff[eèé]/.test(t) || /macchina|filtr|ciald|capsul|solubil|decalcif|zuccher|tazz|bicchier|palett|orzo|ginseng/.test(t)) return;
    let k = 0;
    const mk = t.match(/(\d+(?:[.,]\d+)?)\s*kg/);
    if(mk) k = parseFloat(mk[1].replace(',', '.'));
    else { const mg = t.match(/(\d+(?:[.,]\d+)?)\s*(?:g|gr|grammi)\b/); if(mg) k = parseFloat(mg[1].replace(',', '.')) / 1000; }
    kg += (k > 0 && k <= 50) ? k : 1;
  });
  return kg;
}
function kgGrani(list){
  let kg = 0, n = 0;
  list.forEach(m => {
    let src = m, sg = 1;
    if(m.tipo === 'storno'){ if(!m.orig) return; src = m.orig; sg = -1; }
    if(src.tipo !== 'spesa' || src.stato !== 'confermata') return;
    const k = kgCaffeSpesa(src); if(k){ kg += sg * k; n += sg; }
  });
  return {kg: Math.max(0, Math.round(kg * 1000) / 1000), n: Math.max(0, n)};
}

function aggiornaArticoli(m, ok){
  if(!m || !Array.isArray(m.articoli) || !m.articoli.length) return;
  const b = db.batch(), del = firebase.firestore.FieldValue.delete();
  m.articoli.forEach(id => {
    const r = C('listaSpesa').doc(id);
    if(ok) b.update(r, {stato: 'acquistato', acquistoTs: TS()});
    else b.update(r, {stato: 'da_comprare', acquirenteMid: del, richiestaId: del});
  });
  b.commit().catch(e => toast('Articoli non aggiornati (' + errMsg(e) + ')', 'err'));
}

  st.membri.forEach(m => { const s = d.S.saldi[m.id] || 0; if(s > 0) cred += s; else deb += s; });
  const netto = tot - cred - deb;
  const movC = d.movs.filter(m => descMov(m).cassa || (m.tipo === 'spesa')).reverse();
  return `<h2>${ic('wallet')} Registro cassa</h2><p class="sub">Liquidità del fondo e movimenti contabili.</p>
  <div class="grid3" style="margin-bottom:10px">
