/* ---------- QUOTE ---------- */
const quotaMov = (d, mid, a) => d.movs.find(x => x.tipo === 'quota' && x.mid === mid && String(x.anno) === String(a) && !d.stornati.has(x.id) && x.stato !== 'annullata');
/* vecchi addebiti di quota (modello a debito) mai pagati: danno ancora un saldo ridotto */
function quoteMigra(d){
  const out = [];
  for(const y in d.S.dovute) for(const mid in d.S.dovute[y]){
    if(!(d.S.dovute[y][mid] > 0) || ((d.S.quote[y] || {})[mid] || 0) > 0) continue;
    const m = membro(mid); if(!m || m.attivo === false) continue;
    const mv = d.movs.find(x => x.tipo === 'addebito_quota' && x.mid === mid && String(x.anno) === y && !d.stornati.has(x.id));
    out.push({y, mid, imp: mv ? mv.importo : (st.gruppo.quotaAnnua || 0)});
  }
  return out;
}
function pQuote(d){
  const a = anno();
  const list = membriAttivi().map(m => ({...m, sq: statoQuota(d, m.id, a), qm: quotaMov(d, m.id, a)}))
    .sort((x,y) => (x.sq === 'pagata') - (y.sq === 'pagata') || x.nome.localeCompare(y.nome));
  const pagati = list.filter(m => m.sq === 'pagata').length, mig = quoteMigra(d);
  return `<h2>${ic('users')} Quote fondo ${a}</h2><p class="sub">Quota annuale di ${eur(st.gruppo.quotaAnnua||0)} · pagate ${pagati} su ${list.length}</p>
  <div class="banner sky">${ic('wallet')}<div>La quota è un contributo al fondo, separato dal portafoglio: non crea debiti e non cambia il saldo. Attiva l'interruttore quando la ricevi e scegli se accreditarla anche come crediti consumabili.</div></div>
  ${mig.length ? `<div class="banner amber">${ic('alert')}<div class="grow">${mig.length} ${mig.length === 1 ? 'collega ha' : 'colleghi hanno'} ancora un addebito di quota del vecchio modello non pagato (${eur(mig.reduce((t, x) => t + x.imp, 0))} in meno nei saldi).</div><button class="btn sm amber" id="btn-quota-migra" data-act="quota-migra">Azzera addebiti quota pregressi</button></div>` : ''}
  <div class="card">${cercaBox('quote-lista')}<div class="list" id="quote-lista">${list.map(m => `<div class="li" data-q="${qMem(m)}">
    <div class="av">${esc(m.nome.slice(0,1))}</div><div class="grow"><div class="t">${esc(nomeM(m.id))}</div><div class="d mono">saldo ${eurS(saldo(m.id))}${m.sq === 'pagata' && m.qm && typeof m.qm.cred === 'boolean' ? ' · ' + (m.qm.cred ? 'accreditata come crediti' : 'solo fondo') : ''}</div></div>
    <span class="pill ${m.sq === 'pagata' ? 'green' : 'red'}">${m.sq === 'pagata' ? 'pagata' : 'da pagare'}</span>
    <button class="tgl ${m.sq === 'pagata' ? 'on' : ''}" role="switch" aria-checked="${m.sq === 'pagata'}" aria-label="Quota pagata: ${esc(nomeM(m.id))}" data-act="quota-toggle" data-id="${m.id}"></button></div>`).join('')}</div>${cercaVuoto('quote-lista')}</div>`;
}

/* ---------- STATISTICHE ---------- */
/* consumi pagati nel periodo (caffe, caffe_pagato, snack) dai movimenti gia' in memoria; uno storno vale nel periodo del movimento originale */
function consumiRange(r, mid){
  const R = {caffe: 0, caffeE: 0, snack: 0, snackE: 0, per: {}, mov: []}, stor = derived().stornati;
  const per = x => R.per[x] || (R.per[x] = {c: 0, s: 0, e: 0});
  const pass = (m, sg) => {
    if(m.tipo === 'storno'){ if(m.orig) pass(m.orig, -sg); return; }
    if(m.stato === 'annullata' || (mid && m.mid !== mid)) return;
    if(m.tipo === 'caffe' || m.tipo === 'caffe_pagato'){ const p = per(m.mid); R.caffe += sg * (m.qta || 0); R.caffeE += sg * (m.importo || 0); p.c += sg * (m.qta || 0); p.e += sg * (m.importo || 0); }
    else if(m.tipo === 'snack'){ const p = per(m.mid); R.snack += sg * (m.qta || 0); R.snackE += sg * (m.importo || 0); p.s += sg * (m.qta || 0); p.e += sg * (m.importo || 0); }
    else return;
    if(sg > 0 && !stor.has(m.id)) R.mov.push(m);
  };
  (st.isAdmin && st.arcMov ? st.arcMov : []).concat(tuttiMov()).filter(m => { const t = m.tipo === 'storno' && m.orig ? m.orig.t : m.t; return t >= r.da && t <= r.a; }).forEach(m => pass(m, 1));
  R.righe = Object.entries(R.per).filter(([, v]) => v.c > 0 || v.s > 0 || v.e > 0).map(([id, v]) => ({mid: id, nome: nomeM(id), c: v.c, s: v.s, e: v.e}))
    .sort((a, b) => b.e - a.e || (b.c + b.s) - (a.c + a.s) || a.nome.localeCompare(b.nome));
  R.tot = R.caffeE + R.snackE;
  return R;
}
/* Scheda Resoconto Consumi: immagine PNG disegnata su canvas */
function disegnaConsumi(r, R){
  const W = 1080, P = 56, F = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif', M = 'ui-monospace, Menlo, Consolas, monospace';
  const MAXR = 24, righe = R.righe.slice(0, MAXR), altri = R.righe.length - righe.length;
  const hh = 250, sum = 250, th = 70, rh = 54;
  const Ht = hh + sum + th + Math.max(1, righe.length) * rh + (altri > 0 ? rh : 0) + (righe.length ? rh + 10 : 0) + 120;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = Ht;
  const g = cv.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, Ht); grad.addColorStop(0, '#171a24'); grad.addColorStop(1, '#0d0f16');
  g.fillStyle = grad; g.fillRect(0, 0, W, Ht); g.textBaseline = 'alphabetic';
  g.fillStyle = '#f5a524'; g.font = `800 50px ${F}`; g.fillText('☕ Saletta Armieri — Resoconto Consumazioni', P, 100, W - 2 * P);
  g.fillStyle = '#e8eaf0'; g.font = `600 34px ${F}`; g.fillText(r.label.length > 44 ? r.label.slice(0, 44) + '…' : r.label, P, 160, W - 2 * P);
  g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(P, 190, W - 2 * P, 2);
  // riepilogo
  let y = hh;
  const riga = (l, v, col, big) => { g.fillStyle = '#aab0c2'; g.font = `500 ${big ? 34 : 30}px ${F}`; g.textAlign = 'left'; g.fillText(l, P, y); g.fillStyle = col; g.font = `700 ${big ? 40 : 32}px ${M}`; g.textAlign = 'right'; g.fillText(v, W - P, y); g.textAlign = 'left'; y += big ? 74 : 62; };
  riga(`☕ Caffè serviti (${R.caffe})`, eur(R.caffeE), '#fbbf24');
  riga(`🍫 Snack e bevande (${R.snack})`, eur(R.snackE), '#e8eaf0');
  g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(P, y - 34, W - 2 * P, 2); y += 6;
  riga('Totale consumato', eur(R.tot), '#34d399', true);
  // tabella
  y = hh + sum - 10;
  g.fillStyle = '#f5a524'; g.font = `700 26px ${F}`;
  g.fillText('COLLEGA', P, y); g.textAlign = 'right'; g.fillText('CAFFÈ', W - P - 420, y); g.fillText('SNACK', W - P - 250, y); g.fillText('TOTALE', W - P, y); g.textAlign = 'left';
  g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(P, y + 14, W - 2 * P, 2); y += 14;
  if(!righe.length){ y += rh; g.fillStyle = '#7b8194'; g.font = `500 30px ${F}`; g.fillText('Nessun consumo nel periodo', P, y - 14); }
  righe.forEach((x, i) => {
    y += rh;
    if(i % 2 === 0){ g.fillStyle = 'rgba(255,255,255,.04)'; g.fillRect(P - 12, y - rh + 8, W - 2 * P + 24, rh - 4); }
    g.fillStyle = '#e8eaf0'; g.font = `500 30px ${F}`; g.fillText(x.nome.length > 22 ? x.nome.slice(0, 21) + '…' : x.nome, P, y - 14);
    g.font = `600 30px ${M}`; g.textAlign = 'right'; g.fillText(String(x.c), W - P - 420, y - 14); g.fillText(String(x.s), W - P - 250, y - 14);
    g.fillStyle = '#fbbf24'; g.fillText(eur(x.e), W - P, y - 14); g.textAlign = 'left';
  });
  if(altri > 0){ y += rh; g.fillStyle = '#7b8194'; g.font = `500 26px ${F}`; g.fillText(`…e altri ${altri} ${altri === 1 ? 'collega' : 'colleghi'}`, P, y - 14); }

A['conferma-elimina-gruppo'] = async () => {
  const g0 = st.gruppo; if(!g0 || st.busy) return;
  if(val('eg-nome').trim() !== g0.nome) return toast('Il nome non corrisponde', 'err');
  if(!navigator.onLine) return toast('Serve la connessione per eliminare il gruppo', 'err');
  const gid = st.gid, g = db.collection('saletta').doc(gid), me = st.uid;
  st.busy = true; closeSheet(); toast('Eliminazione in corso…');
  try {

    const ownUtente = g.collection('utenti').doc(me);
    const refs = [g.collection('segreti').doc('pin')];
    snaps[cols.indexOf('membri')].docs.forEach(d => refs.push(g.collection('segretiMembri').doc(d.id)));
    cols.forEach((n, i) => snaps[i].docs.forEach(d => { if(!(n === 'utenti' && d.id === me)) refs.push(d.ref); }));

/* --- Compiti di oggi: catalogo nella mappa «compiti» del documento del gruppo (nessuna lettura in più). Il sorteggio avviene in memoria;

const CP_MAX = 20, CP_K_MAX = 5, CP_ESENTI_MAX = 30;

  const fatti = {}; cpIncarichi().filter(m => m.cp === c.id && m.stato === 'confermata').forEach(m => { fatti[m.mid] = (fatti[m.mid] || 0) + 1; });
  const P = pool.map(mid => ({mid, w: 1 / (1 + (fatti[mid] || 0))})), tot = P.reduce((a, x) => a + x.w, 0);

function bfInizioPeriodo(){
  const o = new Date(); o.setHours(0, 0, 0, 0);
  if(bfPeriodo() === 'mese') return new Date(o.getFullYear(), o.getMonth(), 1).getTime();
  return new Date(o.getFullYear(), o.getMonth(), o.getDate() - ((o.getDay() + 6) % 7)).getTime();
}
function bfRinnovo(){
  const i = new Date(bfInizioPeriodo());
  return (bfPeriodo() === 'mese' ? new Date(i.getFullYear(), i.getMonth() + 1, 1) : new Date(i.getFullYear(), i.getMonth(), i.getDate() + 7)).toLocaleDateString('it-IT', {weekday: 'long', day: 'numeric', month: 'long'});
}
function bfUsati(){
  const ini = bfInizioPeriodo(), d = derived();
  const live = tuttiMov().filter(m => m.tipo === 'ben_fatto' && m.mid === st.mid && m.t >= ini && !d.stornati.has(m.id)).map(m => m.t);
  const prima = ((st.estratto && st.estratto.mp && st.estratto.mp.bf && st.estratto.mp.bf[st.mid]) || []).filter(t => t >= ini);
  return live.length + prima.length;
}

  if(st.sync !== 'ok') return toast('Serve la connessione per chiudere il periodo', 'err');
  const limite = Date.now() - CHIUSURA_MARGINE;
  if(st.movimenti.some(m => m.t <= limite && (m._local || !m._ts)) || Object.keys(st.pending).length) return toast('Attendi che tutti i movimenti siano sincronizzati', 'err');
  const incl = st.movimenti.filter(m => m.t <= limite);
  if(!incl.length) return toast('Nessun movimento da chiudere', 'err');
  if(incl.some(m => m.stato === 'attesa' && m.tipo !== 'scambio')) return toast('Prima conferma o rifiuta le richieste in attesa', 'err');

  const nCpA = incl.filter(m => m.tipo === 'compito' && m.stato === 'assegnato' && !d.stornati.has(m.id)).length;
  if(nCpA && !confirm(`Ci sono ${nCpA} ${nCpA === 1 ? 'incarico ancora da svolgere' : 'incarichi ancora da svolgere'} (Compiti di oggi).\n\nChiudendo il periodo ${nCpA === 1 ? 'verrà archiviato' : 'verranno archiviati'} e non sarà più possibile confermarlo.\n\nProseguire comunque?`)) return;
  if(!confirm(`Chiudere il periodo con ${incl.length} movimenti?`)) return;
  st.busy = true; render();
  try {
    const prev = ultimaChiusura();
    const S = prev && prev.stato ? JSON.parse(JSON.stringify(prev.stato)) : emptyState();
    ['saldi','stock','turni','ultimo','punti','puntiConv','pcaf','pcafConv','pspesa','pbf','pRisc','quote','dovute'].forEach(k => S[k] = S[k] || {}); S.cassa = S.cassa || {contanti:0, revolut:0};
    if(prev && prev.stato && scalaDa() && !prev.sc) riscala(S);   // la chiusura precedente è in scala vecchia: si porta a ×10 prima di sommare
    const T = emptyStats();
    incl.forEach(m => { applyMov(S, m); applyStat(T, m); });
    let fino = incl[0]._ts;
    incl.forEach(m => { if(m._ts.seconds > fino.seconds || (m._ts.seconds === fino.seconds && m._ts.nanoseconds > fino.nanoseconds)) fino = m._ts; });
    const id = 'c' + fino.toMillis();
    const b = db.batch();
    const scF = scalaDa() ? {sc: 1} : {};
    const G = aggrega(incl), riep = {...scF, id, da: prev ? prev.fino.toMillis() : 0, fino: fino.toMillis(), n: incl.length, caffe: G.caffe, snack: G.snack, euro: G.euro, spese: G.spese, speseN: G.speseN, turni: G.turni, pPul: G.pPul, regDati: G.regDati, bfRic: G.bfRic, ptC: G.ptC, ptP: G.ptP, ptS: G.ptS, ptB: G.ptB, ser: serieSett(incl, prev ? prev.fino.toMillis() : 0), tot: G.tot};
    const storico = st.chiusure.map(riepDaChiusura).concat([riep]).sort((x, y) => x.fino - y.fino).slice(-STORICO_MAX);
    const bf = {}, stor = new Set(incl.filter(m => m.tipo === 'storno').map(m => m.rif)), lim = Date.now() - 40 * 864e5;
    if(prev && prev.bf) Object.keys(prev.bf).forEach(k => { bf[k] = (prev.bf[k] || []).slice(); });
    incl.filter(m => m.tipo === 'ben_fatto' && !stor.has(m.id)).forEach(m => { (bf[m.mid] = bf[m.mid] || []).push(m.t); });
    Object.keys(bf).forEach(k => { bf[k] = bf[k].filter(t => t >= lim).slice(-10); if(!bf[k].length) delete bf[k]; });   // ultimi invii di "Ben fatto": servono al gettone a cavallo di una chiusura
    const mp = {pcaf: S.pcaf, pcafConv: S.pcafConv, punti: S.punti, puntiConv: S.puntiConv, turni: S.turni, ultimo: S.ultimo, pspesa: S.pspesa, pbf: S.pbf, pRisc: S.pRisc, bf};
    b.set(C('chiusure').doc(id), {fino, da: prev ? prev.fino : firebase.firestore.Timestamp.fromMillis(0), stato: S, stats: T, riep, bf, ...scF, n: incl.length, uid: st.uid, autore: myName(), ts: TS()});
    const arr = incl.map(compactMov);
    st.membri.forEach(m => {
      const q = {}, dv = {};
      for(const a in S.quote) if(S.quote[a][m.id]) q[a] = S.quote[a][m.id];
      for(const a in S.dovute) if(S.dovute[a][m.id]) dv[a] = S.dovute[a][m.id];
      b.set(C('estratti').doc(m.id), {saldo: S.saldi[m.id] || 0, pcaf: S.pcaf[m.id] || 0, pcafConv: S.pcafConv[m.id] || 0, mp, ...scF, storico, saldi: S.saldi, cassa: S.cassa, quote: q, dovute: dv, fino, chiusura: id});
    });
    for(let i = 0; i * ARCHIVIO_CHUNK < arr.length; i++) b.set(C('archivio').doc(id + '_' + i), {movimenti: arr.slice(i*ARCHIVIO_CHUNK, (i+1)*ARCHIVIO_CHUNK)});
    await b.commit();
    st.archivio = null;
    toast('Periodo chiuso: ' + incl.length + ' movimenti archiviati');
  } catch(e){ toast('Chiusura non riuscita (' + errMsg(e) + ')', 'err'); }
  finally { st.busy = false; render(); }
};

const plain = s => { const e = document.createElement('textarea'); e.innerHTML = String(s == null ? '' : s); return e.value; };
function scaricaBlob(blob, nome){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function condividiBlob(blob, nome, titolo, testo, avviso){
  const f = new File([blob], nome, {type: blob.type});
  if(navigator.canShare && navigator.canShare({files: [f]})){
    try { await navigator.share({files: [f], title: titolo, text: testo}); return true; }
    catch(e){ if(e && e.name === 'AbortError') return false; }
  }
  scaricaBlob(blob, nome); toast(avviso || 'File scaricato'); return false;
}

async function leggiBackup(file){

  if(!bk || !['Armieri 5.0', 'Armieri 5.0'].includes(bk.app) || !bk.situazione || !Array.isArray(bk.membri)) return toast('Il file non è un backup di Armieri 5.0', 'err');

  bk.membri.forEach(m => {
    const att = st.membri.find(x => x.id === m.id);
    if(!att) piano.membri.push(m);
    const target = (bk.situazione.saldi || {})[m.id] || 0, now = att ? (d.S.saldi[m.id] || 0) : 0;

    <div class="card" style="margin:0 0 10px">

    ${infoBtn(`Il ripristino non cancella nulla: aggiunge rettifiche ed entrate/uscite di cassa con causale «Ripristino da backup» per riportare saldi e cassa ai valori del file. Lo storico dei movimenti resta quello attuale (il file JSON conserva l'originale).`, 'Come funziona')}
    <button class="btn amber block big" data-act="conferma-ripristino">Ripristina</button>`}`);
}
A['conferma-ripristino'] = async () => {
  const pi = st.bkPiano; if(!pi) return;
  if(st.sync !== 'ok') return toast('Serve la connessione', 'err');
  st.busy = true; closeSheet();
  try {
    for(const m of pi.membri){
      const dati = clean({nome: m.nome, nick: m.nick || undefined, attivo: m.attivo, espulso: m.espulso});
      await C('membri').doc(m.id).set(dati);
    }
    for(const x of pi.prodotti){ const {id, ...dati} = x; await C('prodotti').doc(id).set(clean(dati)); }
    pi.rett.forEach(r => addMov({tipo: 'rettifica', mid: r.mid, importo: r.diff, causale: 'Ripristino da backup'}));
    pi.cassa.forEach(c => addMov({tipo: c.diff > 0 ? 'entrata' : 'uscita', importo: Math.abs(c.diff), fonte: c.k, causale: 'Ripristino da backup'}));
    st.bkPiano = null; toast('Ripristino completato');
  } catch(e){ toast('Ripristino non riuscito (' + errMsg(e) + ')', 'err'); }
  finally { st.busy = false; render(); }
};

function rndInt(n){ const lim = 4294967296 - 4294967296 % n; let x; do { x = crypto.getRandomValues(new Uint32Array(1))[0]; } while(x >= lim); return x % n; }
function ruotaSt(){
  if(!st.ruota){ const sv = LS.get('ruotaSel', []); st.ruota = {sel: Object.fromEntries(membriAttivi().filter(m => sv.includes(m.id)).map(m => [m.id, true])), ids: [], ang: 0, from: 0, gira: false, t0: 0, win: null, vinc: null}; }
  return st.ruota;
}
function ruotaSvg(ids, nome){
  const n = ids.length, A_ = 360 / n, R = 140, C0 = 150, pt = a => [C0 + R * Math.sin(a * Math.PI / 180), C0 - R * Math.cos(a * Math.PI / 180)];
  const fs = n <= 6 ? 15 : n <= 10 ? 12 : 10, mx = n <= 6 ? 12 : n <= 10 ? 9 : 7;
  return ids.map((id, i) => {
    const a1 = i * A_, a2 = (i + 1) * A_, [x1, y1] = pt(a1), [x2, y2] = pt(a2), mid = a1 + A_ / 2, nm = nome(id), lab = nm.length > mx ? nm.slice(0, mx - 1) + '…' : nm;
    return `<path d="M${C0} ${C0}L${x1.toFixed(2)} ${y1.toFixed(2)}A${R} ${R} 0 ${A_ > 180 ? 1 : 0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}Z" fill="hsl(${Math.round(i * 360 / n)} 62% 42%)" stroke="rgba(255,255,255,.55)" stroke-width="1.5"/>
      <text transform="rotate(${mid.toFixed(2)} ${C0} ${C0})" x="${C0}" y="${C0 - R * 0.62}" text-anchor="middle" dominant-baseline="middle" font-size="${fs}" font-weight="800" fill="#fff">${esc(lab)}</text>`;
  }).join('') + `<circle cx="${C0}" cy="${C0}" r="16" fill="var(--card)" stroke="rgba(255,255,255,.6)" stroke-width="2"/><text x="${C0}" y="${C0 + 1}" text-anchor="middle" dominant-baseline="middle" font-size="16">☕</text>`;
}
function pRuota(d){
  const r = ruotaSt(), nome = id => nomeBreve(id) || nomeM(id), att = membriAttivi().slice().sort((a, b) => nome(a.id).localeCompare(nome(b.id)));
  const sel = att.filter(m => r.sel[m.id]).map(m => m.id), ids = r.gira || r.vinc ? r.ids : sel;
  const anim = r.gira ? `--from:${r.from}deg;--to:${r.ang}deg;animation:ruota-spin 4.2s cubic-bezier(.12,.6,.1,1) ${(-(Date.now() - r.t0) / 1000).toFixed(2)}s forwards` : `transform:rotate(${r.ang}deg)`;
  const ruota = ids.length >= 2 ? `<div class="ruota-box"><div class="ruota-pt"></div><svg viewBox="0 0 300 300" id="ruota-svg" style="${anim}" role="img" aria-label="Ruota con ${ids.length} colleghi">${ruotaSvg(ids, nome)}</svg></div>`
    : '<div class="empty">Spunta almeno 2 colleghi presenti e gira la ruota.</div>';
  const esito = r.vinc && !r.gira ? `<div class="card" id="ruota-esito" style="text-align:center;border-color:var(--amber)"><div style="font-size:40px;line-height:1.1">☕</div><div style="font-size:22px;font-weight:800;margin:4px 0">Tocca a ${esc(nome(r.vinc))}!</div><div class="mut" style="font-size:13px">Alla macchinetta a fare i caffè per tutti.</div></div>` : '';
  return `${backSaletta()}<h2>☕ La Ruota del Barista ${infoBtn(`Chi si mette alla macchinetta? Scegli i presenti e lascia decidere alla sorte.`)}</h2>
  ${ruota}${esito}
  <button class="btn amber block big" id="ruota-gira" data-act="ruota-gira" ${sel.length >= 2 && !r.gira ? '' : 'disabled'}>${r.gira ? 'Gira…' : r.vinc ? '🔁 Rigira la ruota' : '🎡 Gira la ruota!'}</button>
  <div class="card" style="margin-top:12px"><h3><span>Chi c'è</span><span class="row" style="gap:6px"><button class="btn sm ghost" data-act="ruota-tutti" data-v="1" ${r.gira ? 'disabled' : ''}>Tutti</button><button class="btn sm ghost" data-act="ruota-tutti" data-v="0" ${r.gira ? 'disabled' : ''}>Nessuno</button></span></h3>
    ${cercaBox('ruota-lista')}<div class="list" id="ruota-lista">${att.map(m => `<button class="li" data-q="${qMem(m)}" data-act="ruota-toggle" data-id="${m.id}" ${r.gira ? 'disabled' : ''} style="width:100%;text-align:left;${r.sel[m.id] ? 'border-color:var(--green)' : ''}"><div class="av">${r.sel[m.id] ? '☑' : '☐'}</div><div class="grow"><div class="t" style="font-size:14px">${esc(nome(m.id))}${m.id === st.mid ? ' <span class="pill amber">tu</span>' : ''}</div></div></button>`).join('')}</div>
    ${cercaVuoto('ruota-lista')}${infoBtn(`Estrazione casuale e uniforme: ognuno ha la stessa probabilità. Non viene salvato nulla.`, 'Come funziona')}</div>`;
}
A['ruota-toggle'] = ds => { const r = ruotaSt(); if(r.gira) return; r.sel[ds.id] = !r.sel[ds.id]; r.vinc = null; render(); };
A['ruota-tutti'] = ds => { const r = ruotaSt(); if(r.gira) return; cercaFiltra('ruota-lista', membriAttivi()).forEach(m => { if(ds.v === '1') r.sel[m.id] = true; else delete r.sel[m.id]; }); r.vinc = null; render(); };
A['ruota-gira'] = () => {
  const r = ruotaSt(); if(r.gira) return;
  const ids = membriAttivi().slice().sort((a, b) => (nomeBreve(a.id) || nomeM(a.id)).localeCompare(nomeBreve(b.id) || nomeM(b.id))).filter(m => r.sel[m.id]).map(m => m.id);
  if(ids.length < 2) return toast('Scegli almeno 2 colleghi', 'err');
  LS.set('ruotaSel', ids);
  const n = ids.length, A_ = 360 / n, k = rndInt(n), jit = (rndInt(1000) / 1000 - 0.5) * 0.7 * A_;
  r.ids = ids; r.win = ids[k]; r.vinc = null; r.gira = true; r.from = r.ang; r.t0 = Date.now();
  r.ang = (r.from - (r.from % 360)) + 1800 + ((360 - ((k + 0.5) * A_ + jit)) % 360 + 360) % 360;
  render();
  setTimeout(() => { r.gira = false; r.vinc = r.win; try { if(navigator.vibrate) navigator.vibrate([80, 40, 80]); } catch(e){} render(); }, 4300);
};

/* Bacheca delle Perle: listener limitato, attivo solo con la pagina aperta e l'app in primo piano */
let perleUnsub = null, perleKey = '';
function perleSync(){
  const vuole = !!inAppOra() && st.page === 'perle' && document.visibilityState !== 'hidden';
  const key = vuole ? st.gid + '|' + (st.perleN || 20) : '';
  if(key === perleKey) return;
  if(perleUnsub){ perleUnsub(); perleUnsub = null; }
  perleKey = key;
  if(!vuole) return;
  st.perleErr = null;
  perleUnsub = C('perle').orderBy('ts', 'desc').limit(st.perleN || 20).onSnapshot(s => {
    st.perle = s.docs.map(d => ({id: d.id, ...d.data({serverTimestamps: 'estimate'})})); st.perleOk = true; render();
  }, e => { st.perleOk = true; st.perleErr = errMsg(e); render(); });
}
document.addEventListener('visibilitychange', perleSync);
function pPerle(d){
  const L = st.perle || [], N = st.perleN || 20;
  const card = p => `<div class="perla"><q>${esc(p.testo)}</q><div style="margin-top:6px;font-size:13.5px;font-weight:700">— ${esc(p.autore)}${p.contesto ? ` <span class="mut" style="font-weight:500">· ${esc(p.contesto)}</span>` : ''}</div>
    <div class="between" style="margin-top:6px"><span class="mut" style="font-size:11.5px">inserita da ${esc(nomeBreve(p.mid) || nomeM(p.mid) || '?')} · ${p.ts ? quando(tms(p.ts)) : 'ora'}</span>
    ${st.isAdmin || p.mid === st.mid ? `<button class="iconbtn" style="width:32px;height:32px" data-act="perla-del" data-id="${p.id}" aria-label="Elimina">${ic('trash','s')}</button>` : ''}</div></div>`;
  return `${backSaletta()}<div class="between" style="margin-bottom:14px"><div><h2>💬 Bacheca delle Perle</h2><p class="sub" style="margin:0">Frasi celebri sentite in saletta</p></div>
    <button class="btn sm amber" id="btn-perla-nuova" data-act="perla-nuova">${ic('plus','s')} Nuova</button></div>
  ${st.perleErr ? `<div class="banner red">${ic('alert')}<div>Non riesco a leggere la bacheca (${esc(st.perleErr)}).</div></div>` : ''}
  ${L.length ? `<div id="perle-lista">${L.map(card).join('')}</div>` : `<div class="card"><div class="empty">${st.perleOk ? 'Ancora nessuna perla. Inserisci la prima!' : 'Carico…'}</div></div>`}
  ${L.length >= N && N < 30 ? `<button class="btn sm block ghost" data-act="perle-altre">Mostra altre</button>` : ''}`;
}
A['perle-altre'] = () => { st.perleN = 30; render(); };
A['perla-nuova'] = () => {
  const nomi = membriAttivi().map(m => nomeBreve(m.id) || m.nome);
  openSheet(`<h3>💬 Nuova perla ${infoBtn(`Una frase da ricordare, sentita in saletta o durante il turno.`)}</h3>
    <label class="f"><span>Chi l'ha detta</span><input class="in" id="pe-aut" maxlength="40" list="pe-nomi" autocomplete="off" placeholder="es. Marco" autofocus><datalist id="pe-nomi">${nomi.map(n => `<option value="${esc(n)}"></option>`).join('')}</datalist></label>
    <label class="f"><span>La frase</span><textarea class="in" id="pe-txt" maxlength="280" rows="3" placeholder="Scrivi la citazione"></textarea></label>
    <label class="f"><span>Data o contesto (facoltativo)</span><input class="in" id="pe-ctx" maxlength="60" placeholder="es. riunione del lunedì"></label>
    <button class="btn amber block big" id="btn-perla-salva" data-act="perla-salva">Pubblica</button>`);
};
A['perla-salva'] = () => {
  const autore = val('pe-aut'), testo = val('pe-txt'), contesto = val('pe-ctx');
  if(autore.length < 2) return toast('Indica chi l\'ha detta', 'err');
  if(testo.length < 3) return toast('Scrivi la frase', 'err');
  if(st.perleUltima && Date.now() - st.perleUltima < 15000) return toast('Un attimo: aspetta qualche secondo tra una perla e l\'altra', 'err');
  st.perleUltima = Date.now();
  C('perle').add({autore, testo, ...(contesto ? {contesto} : {}), mid: st.mid, ts: TS()}).catch(e => toast('Non salvata (' + errMsg(e) + ')', 'err'));
  closeSheet(); toast('Perla pubblicata 💬');
};
A['perla-del'] = ds => { if(!confirm('Eliminare questa perla?')) return; C('perle').doc(ds.id).delete().catch(e => toast(errMsg(e), 'err')); };

/* ---------- tasto / gesture "Indietro" (History API) ----------
   Una sola voce "sentinella" sopra la base della cronologia: a ogni Indietro l'app decide cosa chiudere
   (sheet, menu, pagina) leggendo lo stato esistente e riarma la sentinella. Dalla Home il primo Indietro avvisa,
   il secondo (entro 2,5 s) esce davvero. Nessun URL cambia e nessun dato viene letto. */
let backArmata = false, backTimer = null;
const GUARD = {armieri: 'guard'};
const inAppOra = () => st.sync !== 'nocfg' && st.gid && st.uid && st.ready.g && st.ready.u && st.mid && membro(st.mid);
function backRiarma(){ clearTimeout(backTimer); backTimer = null; try { history.pushState(GUARD, ''); } catch(e){} }
function backArma(){
  if(backArmata) return;
  try { if(!(history.state && history.state.armieri === 'guard')){ history.replaceState({armieri: 'base'}, ''); history.pushState(GUARD, ''); } backArmata = true; } catch(e){}
}
/* true se l'Indietro e' stato assorbito dall'app (qualcosa da chiudere o una pagina da cui tornare) */
function indietro(){
  if($('infopop') && $('infopop').classList.contains('on')){ A['info-x'](); return true; }
  if($('sheet').classList.contains('on')){ closeSheet(); return true; }
  if($('drawer').classList.contains('on')){ A['drawer-close'](); return true; }
  if(!inAppOra()){ if(st.entry){ st.entry = null; render(); return true; } return false; }
  if(st.pinDoc === null || (st.pinDoc && st.pinDoc.temporaneo)) return false;   // schermata bloccante: nessuna navigazione
  if(st.page !== 'bar'){ A['go']({p: !adminView() && SALETTA_SUB.includes(st.page) && st.page !== 'saletta' ? 'saletta' : 'bar'}); return true; }
  return false;
}
window.addEventListener('popstate', () => {
  if(!backArmata) return;
  if(history.state && history.state.armieri === 'guard') return;   // avanti/indietro verso la sentinella: niente da fare
  if(indietro()){ backRiarma(); return; }
  toast('Premi ancora Indietro per uscire');
  clearTimeout(backTimer);
  backTimer = setTimeout(backRiarma, 2500);
});
/* se l'utente tocca qualcosa durante la finestra di uscita, la sentinella torna subito */
document.addEventListener('click', () => { if(backTimer) backRiarma(); }, true);
/* Chrome ignora le voci aggiunte senza gesto dell'utente: la sentinella si arma al primo tocco */
(function(){
  if(history.state && history.state.armieri === 'guard'){ backArmata = true; return; }
  const arma = () => { document.removeEventListener('click', arma, true); document.removeEventListener('keydown', arma, true); backArma(); };
  document.addEventListener('click', arma, true); document.addEventListener('keydown', arma, true);
})();

/* ---------- avvio ---------- */
(function boot(){
  const m = location.hash.match(/g=([A-Za-z0-9-]+)/);
  if(m){ const c = normCode(m[1]); if(c && !st.gid){ LS.set('invito', c); st.entry = 'join'; } history.replaceState(null, '', location.pathname + location.search); }
  if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  render();
  initFirebase();
})();
</script>
