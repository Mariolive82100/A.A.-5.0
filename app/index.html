<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Armieri 5.0</title>
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Armieri 5.0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400..700;1,400..700&display=swap" media="print" onload="this.media='all'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#0b1020;--bg2:#0e1426;--card:#131b2e;--card2:#18223a;--line:#24304a;--line2:#2e3b58;
  --tx:#eef2f9;--tx2:#b6c0d2;--mut:#7f8ba3;
  --amber:#f5a524;--amber2:#fbbf24;--green:#34d399;--red:#fb7185;--sky:#38bdf8;--violet:#a78bfa;--pink:#f472b6;--teal:#2dd4bf;
  --r:18px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Google Sans","Google Sans Flex","Product Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.35;min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:16px;height:16px}svg.i.l{width:26px;height:26px}
button,input,select,textarea{font-family:inherit}
.mono{font-family:inherit;font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.2px}
.mut{color:var(--mut)}.tx2{color:var(--tx2)}.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.sky{color:var(--sky)}.violet{color:var(--violet)}
.hidden{display:none!important}

/* header */
header{position:sticky;top:0;z-index:30;background:rgba(11,16,32,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(10px + var(--safe-t)) 12px 10px;display:flex;align-items:center;gap:10px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--tx2);position:relative}
.iconbtn:active{background:var(--card2)}
.brand{flex:1;min-width:0}
.brand b{display:flex;align-items:center;gap:6px;font-size:16px;background:linear-gradient(90deg,var(--amber),#fde68a);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand b svg{color:var(--amber)}
.brand small{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
.dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}.dot.off{background:var(--amber)}.dot.err{background:var(--red)}
.chip-saldo{padding:6px 10px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-weight:800;font-size:15px;text-align:right;line-height:1.1}
.chip-saldo small{display:block;font-size:10px;font-weight:600;color:var(--mut)}
.badge{position:absolute;top:3px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center}

main{max-width:640px;margin:0 auto;padding:14px 14px calc(96px + var(--safe-b))}
h2{font-size:18px;margin:0 0 2px;display:flex;align-items:center;gap:8px}
.sub{font-size:12.5px;color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);display:flex;align-items:center;gap:6px;justify-content:space-between}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 14px;border-radius:14px;font-weight:700;font-size:14px;background:var(--card2);border:1px solid var(--line2);color:var(--tx);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.sm{padding:7px 10px;font-size:12.5px;border-radius:11px}
.btn.block{width:100%}
.btn.amber{background:linear-gradient(90deg,var(--amber),#f59e0b);color:#1a1205;border:0}
.btn.green{background:#059669;border-color:#059669;color:#fff}
.btn.red{background:#be123c;border-color:#be123c;color:#fff}
.btn.violet{background:#7c3aed;border-color:#7c3aed;color:#fff}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.link{background:none;border:0;padding:4px 6px;color:var(--amber);font-size:12.5px}
.btn.big{padding:16px;font-size:15px;border-radius:16px}
.btn.giro{background:linear-gradient(90deg,#6366f1,#9333ea);color:#fff;border:0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px;text-align:left;display:block;width:100%}
.tile:active{transform:scale(.98)}
.home{position:relative;overflow:hidden;border-radius:28px;min-height:calc(100vh - 230px);display:flex;flex-direction:column;justify-content:flex-start}
.home .grid{align-content:start}
.gm-hint{border-radius:16px;padding:10px;border:1px solid var(--line);background:rgba(255,255,255,.05)}
.gm-hint.su{border-color:rgba(245,165,36,.5)}.gm-hint.giu{border-color:rgba(56,189,248,.5)}
.gm-hint b{display:block;font-size:20px}.gm-arrow{display:block;font-size:44px;line-height:1.1;animation:gm-pop .5s ease-out}
.gm-final{position:relative;overflow:hidden;text-align:center;padding:26px 14px;margin-bottom:12px}
.gm-conf{position:absolute;inset:0;pointer-events:none}.gm-conf span{position:absolute;top:-40px;animation:gm-fall 3.2s linear infinite}
.gm-cup{font-size:84px;line-height:1.1;animation:gm-bounce 1s ease-in-out infinite}
.gm-loser{font-size:38px;font-weight:900;margin:6px 0;background:linear-gradient(90deg,#f5a524,#f472b6,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent;animation:gm-pop .7s ease-out}
@keyframes gm-fall{to{transform:translateY(420px) rotate(360deg);opacity:.2}}
@keyframes gm-bounce{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-14px) rotate(8deg)}}
@keyframes gm-pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.home .blob{position:absolute;border-radius:50%;filter:blur(46px);opacity:.55;pointer-events:none;z-index:0}
.home .grid{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gbtn{min-height:min(30vh,210px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:14px;border-radius:26px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);color:var(--tx);font-weight:800;font-size:clamp(19px,5.4vw,27px);line-height:1.15;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.gbtn:active{transform:scale(.97)}
.gbtn small{font-size:12.5px;font-weight:600;color:var(--tx2)}
.gbtn .em{font-size:34px;line-height:1}
.gbtn.adm{border-color:rgba(167,139,250,.38);background:linear-gradient(135deg,rgba(245,165,36,.13),rgba(124,58,237,.16))}
body.adm header{border-bottom:2px solid var(--violet)}
.tbw{position:relative;display:inline-flex}
.tb{position:absolute;top:-5px;right:-9px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1}
.tb.tbi{position:static;display:inline-flex;margin-left:6px;vertical-align:middle}
.swbar{display:flex;gap:6px;margin-bottom:12px;padding:4px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.swbar button{flex:1;padding:10px 6px;border-radius:12px;font-weight:700;font-size:12.5px;color:var(--tx2)}
.swbar button.on{background:var(--card2);color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.swbar button.on.adm{color:#c4b5fd;box-shadow:inset 0 0 0 1px var(--violet);background:rgba(124,58,237,.18)}
.sbadge{padding:6px 11px;border-radius:99px;font-weight:800;font-size:13px;font-family:ui-monospace,Menlo,monospace;white-space:nowrap;border:1px solid transparent}
.sbadge.pos{background:rgba(16,185,129,.14);color:var(--green);border-color:rgba(16,185,129,.35)}
.sbadge.neg{background:rgba(251,113,133,.14);color:var(--red);border-color:rgba(251,113,133,.35)}
.tesoro{background:linear-gradient(135deg,var(--card),rgba(124,58,237,.16));border-color:rgba(167,139,250,.35)}
.tesoro .big{font-size:30px;font-weight:800;line-height:1.1}
.homebtns{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.homebtns .btn{min-height:52px;font-size:14px}
main.wide{max-width:980px}
.book{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.book .col{min-width:0}
.booktabs{display:none;gap:6px;margin-bottom:10px}
.booktabs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:13px;color:var(--tx2)}
.booktabs button.on{background:var(--card2);color:var(--amber);border-color:var(--amber)}
.col h4{margin:0 0 2px;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.col .cap{font-size:11.5px;color:var(--mut);margin:0 0 8px}
@media(max-width:720px){.book{grid-template-columns:1fr}.book .col:not(.on){display:none}.booktabs{display:flex}}
.tile .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;margin-bottom:10px}
.tile b{display:block;font-size:14.5px}.tile span{font-size:12px;color:var(--mut)}
.ic.amber{background:rgba(245,165,36,.12);color:var(--amber)}.ic.red{background:rgba(251,113,133,.12);color:var(--red)}.ic.green{background:rgba(52,211,153,.12);color:var(--green)}.ic.violet{background:rgba(167,139,250,.12);color:var(--violet)}.ic.sky{background:rgba(56,189,248,.12);color:var(--sky)}.ic.pink{background:rgba(244,114,182,.12);color:var(--pink)}.ic.mut{background:var(--card2);color:var(--tx2)}
.qty{display:flex;align-items:center;justify-content:center;gap:18px;margin:6px 0 14px}
.qty button{width:44px;height:44px;border-radius:14px;background:var(--card2);border:1px solid var(--line2);font-size:22px;font-weight:700}
.qty span{font-size:30px;font-weight:800;color:var(--amber);min-width:44px;text-align:center}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:700;margin-bottom:3px}
.stat b{font-size:16px}
.list>*{border-top:1px solid var(--line)}
.list>*:first-child{border-top:0}
.li{display:flex;align-items:center;gap:11px;padding:11px 2px}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis}
.li .d{font-size:11.5px;color:var(--mut);margin-top:1px}
.li .amt{font-weight:800;font-size:14px;text-align:right;white-space:nowrap}
.av{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;font-size:17px;background:var(--card2)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;font-size:10.5px;font-weight:800;white-space:nowrap}
.pill.amber{background:rgba(245,165,36,.14);color:var(--amber)}.pill.green{background:rgba(52,211,153,.13);color:var(--green)}.pill.red{background:rgba(251,113,133,.13);color:var(--red)}.pill.mut{background:var(--card2);color:var(--mut)}.pill.violet{background:rgba(167,139,250,.14);color:var(--violet)}.pill.sky{background:rgba(56,189,248,.13);color:var(--sky)}
.strike{text-decoration:line-through;opacity:.55}
.empty{padding:22px 8px;text-align:center;color:var(--mut);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{padding:7px 12px;border-radius:99px;border:1px solid var(--line2);font-size:12.5px;font-weight:700;color:var(--tx2)}
.chips button.on{background:var(--amber);border-color:var(--amber);color:#1a1205}
.bar{height:8px;border-radius:5px;background:var(--card2);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),#818cf8);border-radius:5px}
.cols{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:6px}
.cols div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.cols i{display:block;width:100%;max-width:34px;background:linear-gradient(180deg,var(--amber),#b45309);border-radius:6px 6px 2px 2px;min-height:2px}
.cols span{font-size:9.5px;color:var(--mut);white-space:nowrap}
.cols b{font-size:10px;color:var(--tx2)}
.banner{border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.banner.amber{background:rgba(245,165,36,.1);border:1px solid rgba(245,165,36,.3);color:#fde68a}
.banner.red{background:rgba(251,113,133,.1);border:1px solid rgba(251,113,133,.3);color:#fecdd3}
.banner.sky{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.25);color:#bae6fd}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th.s{cursor:pointer}th.r,td.r{text-align:right}th.c,td.c{text-align:center}
td{padding:10px 6px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.stepper{display:inline-flex;align-items:center;gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:2px}
.stepper button{width:28px;height:28px;border-radius:9px;font-weight:800;color:var(--tx2)}
.stepper button:active{background:var(--card2)}
.stepper b{min-width:26px;text-align:center}

/* form */
label.f{display:block;margin-bottom:11px}
label.f>span{display:block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
.in{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:11px 12px;font-size:16px;outline:none}
.in:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(245,165,36,.15)}
textarea.in{min-height:96px;resize:vertical}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg input{display:none}
.seg label{padding:11px 6px;text-align:center;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);font-size:13px;font-weight:700;color:var(--tx2);cursor:pointer}
.seg input:checked+label{border-color:var(--amber);color:var(--amber);background:rgba(245,165,36,.08)}
.check{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--line);background:var(--bg2);border-radius:13px;margin-bottom:7px;cursor:pointer}
.check input{width:19px;height:19px;accent-color:var(--violet)}
.hint{font-size:12px;color:var(--mut);margin:-4px 0 12px}

/* dock */
nav.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(11,16,32,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:block;padding:6px 4px calc(6px + var(--safe-b))}
nav.dock .dk{display:flex}
nav.dock button.fab{display:flex;flex-direction:column;align-items:center;flex:none;width:86px;height:86px;margin:-34px 6px 0;border-radius:50%;background:radial-gradient(circle at 30% 25%,#232b4a,#131a33);border:2px solid var(--amber);box-shadow:0 6px 22px rgba(0,0,0,.55),0 0 0 5px rgba(11,16,32,.94);justify-content:center;gap:2px;padding:4px;color:var(--tx)}
nav.dock button.fab small{font-size:10.5px;font-weight:600;color:var(--tx2);max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.dock button.fab b{font-size:15px;line-height:1.1;max-width:78px;white-space:nowrap}
nav.dock button.fab.on{border-color:var(--green);transform:scale(.96)}
#fab-ov{position:fixed;inset:0;z-index:31;background:rgba(2,6,23,.6);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);display:none}
#fab-ov.on{display:block}
#fab-menu{position:fixed;left:50%;bottom:calc(112px + var(--safe-b));transform:translateX(-50%);z-index:32;display:none;gap:10px;align-items:flex-end}
#fab-menu.on{display:flex}
#fab-menu button{width:94px;min-height:94px;border-radius:26px;background:var(--card);border:1px solid var(--line2);color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700;text-align:center;padding:8px 4px;line-height:1.15}
#fab-menu button:nth-child(2){margin-bottom:22px}
#fab-menu button:disabled{opacity:.35}
#fab-menu button.a1{border-color:var(--amber);color:var(--amber)}
#fab-menu button.a2{border-color:var(--sky);color:var(--sky)}
#fab-menu button.a3{border-color:var(--green);color:var(--green)}
nav.dock .dk button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:13px;color:var(--mut);font-size:10px;font-weight:700;min-width:0;flex:1;text-align:center;line-height:1.1}
nav.dock .dk button.on{color:var(--amber)}

/* drawer */
.ov{position:fixed;inset:0;z-index:40;background:rgba(2,6,23,.7);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
aside.drawer{position:fixed;top:0;bottom:0;left:0;z-index:41;width:280px;max-width:84vw;background:var(--card);border-right:1px solid var(--line);padding:calc(16px + var(--safe-t)) 12px 16px;transform:translateX(-102%);transition:transform .25s;display:flex;flex-direction:column;overflow-y:auto}
aside.drawer.on{transform:none}
aside.drawer .nb{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:13px;font-weight:600;font-size:14px;color:var(--tx2);text-align:left}
aside.drawer .nb.on{background:var(--card2);color:var(--amber)}
aside.drawer .sep{height:1px;background:var(--line);margin:8px 4px}

/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:8px 16px calc(18px + var(--safe-b));max-height:88vh;overflow-y:auto;transform:translateY(105%);transition:transform .25s}
.sheet.on{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line2);margin:4px auto 12px}
.sheet h3{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:8px}
.sheet .sub{margin-bottom:14px}
#sheet-ov{z-index:50}

/* toast */
#toast{position:fixed;left:50%;top:calc(12px + var(--safe-t));z-index:60;transform:translate(-50%,-160%);transition:transform .25s;background:#1d2740;border:1px solid var(--line2);border-radius:16px;padding:11px 14px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:10px;max-width:92vw;box-shadow:0 12px 30px rgba(0,0,0,.45)}
#toast.on{transform:translate(-50%,0)}
#toast.err{border-color:rgba(251,113,133,.5)}
#toast button{color:var(--amber);font-weight:800;padding:2px 6px;white-space:nowrap}

/* entry screens */
.hero{text-align:center;padding:28px 6px 18px}
.hero .logo{width:76px;height:76px;border-radius:24px;margin:0 auto 14px;background:rgba(245,165,36,.12);border:1px solid rgba(245,165,36,.3);display:grid;place-items:center;color:var(--amber)}

<script>
'use strict';
/* =====================================================================
   Armieri 5.0 — app condivisa con Firebase (Firestore + accesso anonimo)
   ===================================================================== */
const VERSION = '1.1.0';
const MAXOP = 50000, BUSTA_CAFFE = 130;
const PUNTI_DEF = 1, PUNTI_CREDITO_DEF = 3, SUSS_GIORNI = 7;
const FIREBASE_CONFIG = window.FIREBASE_CONFIG || null;
const SOGLIA_SCORTA = 2;          // giacenza sotto cui un articolo e' "da ricomprare"
const ANNULLA_MIN = 10;           // minuti per annullare un caffe'/snack preso per sbaglio
const CHIUSURA_MARGINE = 15 * 60000; // i movimenti degli ultimi 15 minuti restano nel periodo aperto
const ARCHIVIO_CHUNK = 1500;

/* ---------- utilita' ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic = (n, cls='') => `<svg class="i ${cls}"><use href="#i-${n}"/></svg>`;
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('ps_'+k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('ps_'+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem('ps_'+k); }catch(e){} }
};
const eur = c => (c < 0 ? '-' : '') + (Math.abs(c||0)/100).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
const eurS = c => (c > 0 ? '+' : '') + eur(c);
function parseEuro(v){
  if(v == null) return NaN;
  const s = String(v).trim().replace(/\s|€/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',', '.');
  if(!/^-?\d+(\.\d{0,2})?$/.test(s)) return NaN;
  return Math.round(parseFloat(s) * 100);
}
const pad = n => String(n).padStart(2,'0');
function dataOra(ms){ const d = new Date(ms); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function quando(ms){
  if(!ms) return '';
  const diff = Date.now() - ms, d = new Date(ms), oggi = new Date();
  if(diff < 60000) return 'ora';
  if(diff < 3600000) return Math.floor(diff/60000) + ' min fa';
  const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if(d.toDateString() === oggi.toDateString()) return 'oggi ' + hm;
  const ieri = new Date(oggi); ieri.setDate(oggi.getDate()-1);
  if(d.toDateString() === ieri.toDateString()) return 'ieri ' + hm;
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}` + (d.getFullYear() !== oggi.getFullYear() ? '/'+String(d.getFullYear()).slice(2) : '') + ' ' + hm;
}
function clean(o){ const r = {}; for(const k in o){ if(o[k] !== undefined) r[k] = o[k]; } return r; }
function add(o, k, v){ o[k] = (o[k] || 0) + v; }
function newCode(){
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', b = new Uint8Array(12);
  crypto.getRandomValues(b);
  const s = Array.from(b, x => A[x % A.length]).join('');
  return s.slice(0,4) + '-' + s.slice(4,8) + '-' + s.slice(8,12);
}
function normCode(v){
  const s = String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(s.length !== 12) return null;
  return s.slice(0,4) + '-' + s.slice(4,8) + '-' + s.slice(8,12);
}
const anno = () => String(new Date().getFullYear());
const oggiISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const FONTI = {contanti:'Contanti in sala', revolut:'Conto Revolut', tasca:'Di tasca propria'};
function errMsg(e){
  const c = (e && (e.code || e.message)) || String(e);
  if(/permission/i.test(c)) return 'permesso negato';
  if(/unavailable|network|offline/i.test(c)) return 'nessuna connessione';
  return c;
}

/* ---------- stato ---------- */
const st = {
  page: LS.get('page','bar'), vista: LS.get('vista','admin'), buste: [], uid: null, gid: LS.get('gid', null), mid: LS.get('mid', null),
  gruppo: null, membri: [], prodotti: [], eventi: [], chiusure: [], movimenti: [], pending: {},
  admins: [], utenti: [], isAdmin: false,
  ready: {}, sync: 'conn', syncErr: '', entry: null, busy: false,
  caffeQta: 1, riscSel: {}, riscMet: 'contanti', invSort: {k:'nome', asc:true}, feedFiltro: 'tutti', statPeriodo: 'corrente',
  archivio: null
};

/* ---------- Firebase ---------- */
let db = null, unsubs = [], movUnsub = null, movUnsubD = null, lastCutoffKey = null;
const TS = () => firebase.firestore.FieldValue.serverTimestamp();
const G = () => db.collection('saletta').doc(st.gid);
const C = n => G().collection(n);

function initFirebase(){
  const cfgOk = FIREBASE_CONFIG && (FIREBASE_CONFIG.demo || (FIREBASE_CONFIG.apiKey && !/INCOLLA|YOUR_|XXXX/i.test(FIREBASE_CONFIG.apiKey + (FIREBASE_CONFIG.projectId || ''))));
  if(!cfgOk || typeof firebase === 'undefined'){ st.sync = 'nocfg'; render(); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  db.enablePersistence({synchronizeTabs: true}).catch(() => {});
  firebase.auth().onAuthStateChanged(u => {
    if(!u) return;
    st.uid = u.uid;
    if(st.gid) connect(st.gid); else { st.sync = 'ok'; render(); }
  });
  firebase.auth().signInAnonymously().catch(e => { st.sync = 'err'; st.syncErr = e.code || e.message; render(); });
}

function onErr(e){ console.error(e); st.sync = 'err'; st.syncErr = e.code || e.message; render(); }
function setSync(s){
  if(!s || !s.metadata) return;
  st.sync = s.metadata.fromCache ? (navigator.onLine ? 'conn' : 'off') : 'ok';
}

function disconnect(){
  unsubs.forEach(u => u()); unsubs = [];
  stopData();
  modeKey = null;
  _derCache = null;
  Object.assign(st, {gruppo:null, membri:[], prodotti:[], eventi:[], chiusure:[], estratto:null, movimenti:[], pending:{}, admins:[], utenti:[], richiesta:null, richieste:[], reqAdmin:null, richAdmin:[], riscatti:[], acquisti:[], buste:[], movD:[], fab:false, isAdmin:false, ready:{}, archivio:null});
}

function connect(gid){
  disconnect();
  st.gid = gid;
  const g = db.collection('saletta').doc(gid);
  const docs = s => s.docs.map(d => ({id: d.id, ...d.data({serverTimestamps:'estimate'})}));
  // includeMetadataChanges: senza, dopo il primo snapshot dalla cache lo stato restava grigio finché i dati non cambiavano
  unsubs.push(g.onSnapshot({includeMetadataChanges: true}, s => {
    if(!s.exists){
      if(!s.metadata.fromCache){ toast('Il gruppo non esiste più su questo codice', 'err'); A['esci-gruppo'](true); }
      return;
    }
    st.gruppo = {id: s.id, ...s.data()}; st.ready.g = true; setSync(s); render();
  }, onErr));
  unsubs.push(g.collection('richieste').doc(st.uid).onSnapshot(s => {
    st.richiesta = s.exists ? s.data() : null; st.ready.r = true; render();
  }, onErr));
  unsubs.push(g.collection('richiesteAdmin').doc(st.uid).onSnapshot(s => { st.reqAdmin = s.exists ? s.data() : null; render(); }, () => {}));
  unsubs.push(g.collection('utenti').doc(st.uid).onSnapshot(s => {
    if(s.exists){ st.mid = s.data().mid; LS.set('mid', st.mid); }
    else if(!s.metadata.fromCache){ st.mid = null; LS.del('mid'); }
    st.ready.u = true;
    if(!s.metadata.hasPendingWrites) syncMode();   // aspetta che il server abbia registrato il collegamento telefono → collega
    render();
  }, onErr));
  unsubs.push(g.collection('admin').doc(st.uid).onSnapshot(s => {
    const era = st.isAdmin;
    st.isAdmin = s.exists && !s.metadata.hasPendingWrites ? true : (s.exists && era);
    if(!s.exists) st.isAdmin = false;
    st.ready.a = true; syncMode(); render();
  }, onErr));
}

/* Dati riservati: l'amministratore scarica registro, chiusure e anagrafica telefoni;
   il collega scarica solo i propri movimenti e il proprio estratto (saldo all'ultima chiusura). */
let dataUnsubs = [], modeKey = null;
function stopData(){
  dataUnsubs.forEach(u => u()); dataUnsubs = [];
  if(movUnsub){ movUnsub(); movUnsub = null; }
  if(movUnsubD){ movUnsubD(); movUnsubD = null; }
  lastCutoffKey = null;
}
let retryT = null, retryN = 0;
const onDataErr = e => {
  if(!/permission/i.test(e.code || e.message)) return onErr(e);
  // di solito succede durante un cambio di ruolo o appena scelto il nome: riprova qualche volta
  console.warn('permesso negato, riprovo', e);
  clearTimeout(retryT);
  if(retryN++ < 5) retryT = setTimeout(() => { modeKey = null; syncMode(); render(); }, 1500 * retryN);
};
function syncMode(){
  if(!st.ready.a || !st.ready.u) return;
  const key = st.isAdmin ? 'admin' : (st.mid ? 'user:' + st.mid : 'none');
  if(key === modeKey) return;
  modeKey = key;
  if(key === 'admin' || key.startsWith('user')) setTimeout(() => { if(modeKey === key) retryN = 0; }, 20000);
  stopData();
  Object.assign(st, {chiusure:[], estratto:null, movimenti:[], movD:[], riscatti:[], acquisti:[], buste:[], admins:[], utenti:[], richieste:[], richAdmin:[], archivio:null});
  st.ready.mv = false; _derCache = null;
  if(key === 'none'){ Object.assign(st, {membri:[], prodotti:[], eventi:[]}); st.ready.m = false; return; }
  // dati comuni, leggibili solo da chi è già stato accettato nel gruppo
  const docs = s => s.docs.map(d => ({id: d.id, ...d.data({serverTimestamps:'estimate'})}));
  dataUnsubs.push(C('membri').onSnapshot(s => { st.membri = docs(s).sort((a,b) => a.nome.localeCompare(b.nome, 'it')); st.ready.m = true; render(); }, onDataErr));
  dataUnsubs.push(C('prodotti').onSnapshot(s => { st.prodotti = docs(s); render(); }, onDataErr));
  dataUnsubs.push(C('eventi').onSnapshot(s => { st.eventi = docs(s); render(); }, onDataErr));
  dataUnsubs.push(C('riscatti').onSnapshot(s => { st.riscatti = docs(s); render(); }, onDataErr));
  dataUnsubs.push(C('acquisti').onSnapshot(s => { st.acquisti = docs(s); render(); }, onDataErr));
  dataUnsubs.push(C('buste').onSnapshot(s => { st.buste = docs(s); render(); }, onDataErr));
  if(key === 'admin'){
    dataUnsubs.push(C('chiusure').orderBy('fino').onSnapshot(s => {
      st.chiusure = s.docs.map(d => ({id: d.id, ...d.data()})); _derCache = null;
      const last = ultimaChiusura(), k = last ? last.id : '-';
      if(k !== lastCutoffKey){ lastCutoffKey = k; subMovimenti(last ? last.fino : firebase.firestore.Timestamp.fromMillis(0), null); }
      render();
    }, onDataErr));
    dataUnsubs.push(C('admin').onSnapshot(s => { st.admins = s.docs.map(d => ({id: d.id, ...d.data({serverTimestamps:'estimate'})})); render(); }, onDataErr));
    dataUnsubs.push(C('utenti').onSnapshot(s => { st.utenti = s.docs.map(d => ({id: d.id, ...d.data()})); render(); }, onDataErr));
    dataUnsubs.push(C('richiesteAdmin').onSnapshot(s => { st.richAdmin = s.docs.map(d => ({id: d.id, ...d.data({serverTimestamps:'estimate'})})).filter(r => r.stato === 'attesa'); render(); }, onDataErr));
    dataUnsubs.push(C('richieste').onSnapshot(s => { st.richieste = s.docs.map(d => ({id: d.id, ...d.data({serverTimestamps:'estimate'})})).filter(r => r.stato === 'attesa'); render(); }, onDataErr));
  } else if(st.mid){
    const mid = st.mid;
    dataUnsubs.push(C('estratti').doc(mid).onSnapshot(s => {
      st.estratto = s.exists ? s.data() : null; _derCache = null;
      const k = st.estratto ? st.estratto.chiusura : '-';
      if(k !== lastCutoffKey){ lastCutoffKey = k; subMovimenti(st.estratto ? st.estratto.fino : firebase.firestore.Timestamp.fromMillis(0), mid); }
      render();
    }, onDataErr));
  }
}

function subMovimenti(cutoff, mid){
  if(movUnsub) movUnsub();
  if(movUnsubD){ movUnsubD(); movUnsubD = null; }
  st.ready.mv = false; st.movD = [];
  mid = null;   // registro trasparente: tutti i membri leggono tutti i movimenti
  if(mid){   // scambi di crediti indirizzati a me

      _derCache = null; render();

const ultimaChiusura = () => st.chiusure.length ? st.chiusure[st.chiusure.length - 1] : null;
function tuttiMov(){
  const ids = new Set(st.movimenti.map(m => m.id));
  const extra = st.movD.filter(m => !ids.has(m.id)); extra.forEach(m => ids.add(m.id));
  return st.movimenti.concat(extra, Object.values(st.pending).filter(p => !ids.has(p.id))).sort((a,b) => a.t - b.t);
}
function emptyState(){ return {saldi:{}, cassa:{contanti:0, revolut:0}, stock:{}, turni:{}, ultimo:{}, punti:{}, puntiConv:{}, quote:{}, dovute:{}}; }
const METODI_QUOTA = {contanti:'Contanti', revolut:'Revolut', credito:'Dal credito', esterno:'Già versata'};
function emptyStats(){ return {caffe:{}, snack:{}, euroMid:{}, spese:0, ricariche:0, n:0}; }

function applyMov(S, m, sg){
  sg = sg || 1;
  switch(m.tipo){
    case 'caffe': if(m.stato !== 'annullata') add(S.saldi, m.mid, -sg*m.importo); break;
    case 'snack': if(m.stato !== 'annullata'){ add(S.saldi, m.mid, -sg*m.importo); add(S.stock, m.pid, -sg*m.qta); } break;
    case 'ricarica': if(m.stato === 'confermata'){ add(S.saldi, m.mid, sg*m.importo); add(S.cassa, m.metodo, sg*m.importo); } break;
    case 'spesa':
      if(m.stato === 'confermata'){
        if(m.fonte === 'tasca') add(S.saldi, m.mid, sg*m.importo); else if(m.fonte === 'contanti' || m.fonte === 'revolut') add(S.cassa, m.fonte, -sg*m.importo);
      } break;
    case 'uscita': add(S.cassa, m.fonte, -sg*m.importo); break;
    case 'entrata': add(S.cassa, m.fonte, sg*m.importo); break;
    case 'giroconto': add(S.cassa, m.da, -sg*m.importo); add(S.cassa, m.a, sg*m.importo); break;
    // quota annua: l'addebito abbassa il saldo; il pagamento lo riporta su e (se in contanti/Revolut) entra in cassa
    case 'addebito_quota': add(S.saldi, m.mid, -sg*m.importo); S.dovute[m.anno] = S.dovute[m.anno] || {}; add(S.dovute[m.anno], m.mid, sg); break;
    case 'quota':
      S.quote[m.anno] = S.quote[m.anno] || {}; add(S.quote[m.anno], m.mid, sg);
      if(m.metodo === 'contanti' || m.metodo === 'revolut'){ add(S.saldi, m.mid, sg*m.importo); add(S.cassa, m.metodo, sg*m.importo); }
      else if(m.metodo === 'esterno') add(S.saldi, m.mid, sg*m.importo);
      break;   // 'credito': pagata scalando il credito gia' versato, nessun movimento di soldi
    case 'scambio': if(m.stato === 'confermata'){ add(S.saldi, m.daMid, -sg*m.importo); add(S.saldi, m.aMid, sg*m.importo); } break;
    case 'riscatto': if(m.stato !== 'annullata'){ add(S.saldi, m.mid, -sg*m.importo); add(S.cassa, m.metodo, -sg*m.importo); } break;
    case 'rettifica': case 'accredito': add(S.saldi, m.mid, sg*m.importo); break;
    case 'carico': add(S.stock, m.pid, sg*m.qta); break;
    case 'conversione': add(S.saldi, m.mid, sg*m.importo); add(S.puntiConv, m.mid, sg*m.punti); break;
    case 'pulizia': (m.mids || []).forEach(x => { add(S.turni, x, sg); add(S.punti, x, sg*(m.punti ?? PUNTI_DEF)); if(sg > 0) S.ultimo[x] = Math.max(S.ultimo[x] || 0, m.giorno ? new Date(m.giorno + 'T12:00:00').getTime() : (m.t || 0)); }); break;
    case 'storno': if(m.orig) applyMov(S, m.orig, -sg); break;
  }
}
function applyStat(T, m, sg){
  sg = sg || 1;
  if(m.tipo === 'caffe' && m.stato !== 'annullata'){ add(T.caffe, m.mid, sg*m.qta); add(T.euroMid, m.mid, sg*m.importo); }
  else if(m.tipo === 'snack' && m.stato !== 'annullata'){ add(T.snack, m.pid, sg*m.qta); add(T.euroMid, m.mid, sg*m.importo); }
  else if(m.tipo === 'spesa' && m.stato === 'confermata') T.spese += sg*m.importo;
  else if(m.tipo === 'uscita') T.spese += sg*m.importo;
  else if(m.tipo === 'ricarica' && m.stato === 'confermata') T.ricariche += sg*m.importo;
  else if(m.tipo === 'storno' && m.orig) applyStat(T, m.orig, -sg);
}

let _derCache = null;
function derived(){
  if(_derCache) return _derCache;
  const movs = tuttiMov();
  const last = st.isAdmin ? ultimaChiusura() : null;
  const S = last && last.stato ? JSON.parse(JSON.stringify(last.stato)) : emptyState();
  ['saldi','stock','turni','ultimo','punti','puntiConv','quote','dovute'].forEach(k => S[k] = S[k] || {});
  S.cassa = S.cassa || {contanti:0, revolut:0};
  if(!st.isAdmin && st.estratto){
    for(const a in (st.estratto.quote || {})) S.quote[a] = {[st.mid]: st.estratto.quote[a]};
    for(const a in (st.estratto.dovute || {})) S.dovute[a] = {[st.mid]: st.estratto.dovute[a]};
  }
  // il collega parte dal proprio saldo all'ultima chiusura (estratto) e somma solo i suoi movimenti
  if(!st.isAdmin && st.estratto){
    // base della chiusura: saldi di tutti e cassa (il registro è trasparente), così i totali del Fondo sono corretti
    if(st.estratto.saldi) S.saldi = {...st.estratto.saldi};
    if(st.estratto.cassa) S.cassa = {contanti: st.estratto.cassa.contanti || 0, revolut: st.estratto.cassa.revolut || 0};
    S.saldi[st.mid] = st.estratto.saldo || 0;
  }
  const T = emptyStats();
  const stornati = new Set();
  movs.forEach(m => { applyMov(S, m); applyStat(T, m); if(m.tipo === 'storno') stornati.add(m.rif); });
  T.n = movs.length;
  _derCache = {S, T, movs, stornati, pendenti: movs.filter(m => m.stato === 'attesa' && m.tipo !== 'scambio'), scambiAttesa: movs.filter(m => m.stato === 'attesa' && m.tipo === 'scambio')};
  return _derCache;
}

const nomeM = mid => { const m = membro(mid); return m ? m.nome + (m.nick ? ` (${m.nick})` : '') : '(sconosciuto)'; };
const nomeBreve = mid => { const m = membro(mid); return m ? (m.nick || m.nome) : ''; };

const validaNick = v => v.length <= 20;
const prodotto = pid => st.prodotti.find(p => p.id === pid);
const myName = () => nomeM(st.mid);
const membriAttivi = () => st.membri.filter(m => m.attivo !== false);
const statoQuota = (d, mid, a) => ((d.S.quote[a] || {})[mid] || 0) > 0 ? 'pagata' : ((d.S.dovute[a] || {})[mid] || 0) > 0 ? 'dovuta' : 'nessuna';
const saldo = mid => derived().S.saldi[mid] || 0;
// quanto posso ancora saldare / riscattare, tolte le operazioni gia' in corso
function debitoLibero(){
  const d = derived(), s = d.S.saldi[st.mid] || 0;
  const inCorso = d.pendenti.filter(m => m.tipo === 'ricarica' && m.mid === st.mid).reduce((a, m) => a + m.importo, 0)
    + d.scambiAttesa.filter(m => m.aMid === st.mid && m.mid === st.mid).reduce((a, m) => a + m.importo, 0);
  return Math.max(0, -s - inCorso);
}
const puntiPulizia = () => (st.gruppo && st.gruppo.puntiPulizia) || PUNTI_DEF;
const puntiPerCredito = () => (st.gruppo && st.gruppo.puntiPerCredito) || PUNTI_CREDITO_DEF;
const puntiDisp = (d, mid) => Math.max(0, (d.S.punti[mid] || 0) - (d.S.puntiConv[mid] || 0));
function giorniLavorativi(da, a){
  const x = new Date(da), f = new Date(a || Date.now()); x.setHours(12,0,0,0); f.setHours(12,0,0,0);
  let n = 0; while(x < f){ x.setDate(x.getDate() + 1); const w = x.getDay(); if(w !== 0 && w !== 6) n++; } return n;
}
const msDoc = r => r && r.ts && r.ts.toMillis ? r.ts.toMillis() : Date.now();
const resEff = r => Math.min(r.residuo, Math.max(0, saldo(r.mid) || 0));
const riscattiAperti = () => st.riscatti.filter(r => r.fondo && r.stato === 'aperta' && resEff(r) > 0);
const mieiRiscatti = () => st.riscatti.filter(r => r.mid === st.mid && r.stato === 'aperta' && resEff(r) > 0);
function creditoLibero(){
  const d = derived(), s = d.S.saldi[st.mid] || 0;
  const inCorso = mieiRiscatti().reduce((a, r) => a + resEff(r), 0)
    + d.scambiAttesa.filter(m => m.daMid === st.mid && m.mid === st.mid && !m.rif).reduce((a, m) => a + m.importo, 0);
  return Math.max(0, s - inCorso);
}

function addMov(data, id, silenzioso){

}

function debitori(d){ return membriAttivi().filter(m => m.id !== st.mid).map(m => ({m, s: d.S.saldi[m.id] || 0})).filter(x => x.s < 0).map(x => ({m: x.m, deb: -x.s})).sort((a, b) => b.deb - a.deb || a.m.nome.localeCompare(b.m.nome)); }

}

/* ---------- tesoreria / home amministratore ---------- */
const fondoNoto = () => st.isAdmin || !st.estratto || !!st.estratto.cassa;
function tesoro(d){
  const c = d.S.cassa || {contanti:0, revolut:0};
  const cassa = (c.contanti || 0) + (c.revolut || 0);
  let cred = 0, deb = 0;
  Object.keys(d.S.saldi).forEach(k => { const v = d.S.saldi[k] || 0; if(v > 0) cred += v; else deb += -v; });
  return {cassa, cont: c.contanti || 0, rev: c.revolut || 0, cred, deb, netto: cassa - cred + deb};
}

    ${sp.length ? `<div class="list">${sp.map(m => `<div class="li" style="display:block">

/* ---------- registro movimenti, notifiche ---------- */
const tms = x => x && x.toMillis ? x.toMillis() : (typeof x === 'number' ? x : 0);
function saldoDisp(d){ const s = d.S.saldi[st.mid] || 0; return s > 0 ? creditoLibero() : s; }
function pRegistro(d){ return pFeed(d); }
const notifSeen = () => LS.get('notifSeen_' + st.mid, 0);
function notifiche(d){
  const me = st.mid, out = [];
  if(!me || !d) return out;
  d.movs.forEach(m => {
    const t = tms(m.esitoTs) || m.t || 0, ok = m.stato === 'confermata';
    if(m.tipo === 'spesa' && m.mid === me && m.esitoDa && (ok || m.stato === 'rifiutata')) out.push({t, e: ok ? '✅' : '❌', x: `La tua spesa «${esc(m.descr || '')}» (${eur(m.importo)}) è stata ${ok ? 'approvata' : 'rifiutata'}`});
    else if(m.tipo === 'ricarica' && m.mid === me && m.esitoDa && (ok || m.stato === 'rifiutata')) out.push({t, e: ok ? '✅' : '❌', x: `Il tuo pagamento di ${eur(m.importo)} è stato ${ok ? 'approvato' : 'rifiutato'}`});
    else if(m.tipo === 'accredito' && m.mid === me) out.push({t, e: '🎁', x: `Accredito ricevuto: ${eur(m.importo)} di crediti${m.causale ? ' · ' + esc(m.causale) : ''}`});
    else if(m.tipo === 'conversione' && m.mid === me) out.push({t, e: '🔄', x: `Hai convertito ${m.punti} Punti Pulizia in ${eur(m.importo)} di crediti`});
    else if(m.tipo === 'riscatto' && m.mid === me) out.push({t, e: '🏦', x: `Il Fondo Gruppo ti ha liquidato ${eur(m.importo)}`});
    else if(m.tipo === 'scambio'){
      if(m.stato === 'confermata' && m.daMid === me) out.push({t, e: '🤝', x: `${esc(nomeM(m.aMid))} ha comprato ${eur(m.importo)} dei tuoi crediti`});
      else if(m.stato === 'confermata' && m.aMid === me) out.push({t, e: '🤝', x: `Hai ricevuto ${eur(m.importo)} di crediti da ${esc(nomeM(m.daMid))}: ricezione confermata`});
      else if(m.stato === 'rifiutata' && m.mid === me) out.push({t, e: '❌', x: `${esc(nomeM(m.dest))} ha rifiutato lo scambio di ${eur(m.importo)}`});
    }
  });
  return out.sort((a, b) => b.t - a.t).slice(0, 40);
}
/* ---------- giacenze (copia pubblica, aggiornata dagli admin) ---------- */
const giacSent = {};
/* i colleghi calcolano il Totale Fondo dall'estratto: l'admin completa gli estratti vecchi con saldi e cassa dell'ultima chiusura */
let estrSent = '';
function sincronizzaEstratti(){
  const last = ultimaChiusura();
  if(!st.isAdmin || st.sync !== 'ok' || modeKey !== 'admin' || !last || !last.stato || estrSent === last.id) return;
  estrSent = last.id;
  const dati = {saldi: last.stato.saldi || {}, cassa: last.stato.cassa || {contanti:0, revolut:0}};
  st.membri.forEach(m => C('estratti').doc(m.id).update(dati).catch(() => {}));
}
function sincronizzaGiacenze(d){
  if(!st.isAdmin || st.sync !== 'ok' || !st.ready.mv || modeKey !== 'admin') return;
  st.prodotti.forEach(p => {
    const v = d.S.stock[p.id] || 0, k = p.id + ':' + v;
    if(p.giacenza !== v && !giacSent[k]){ giacSent[k] = 1; C('prodotti').doc(p.id).set({giacenza: v}, {merge: true}).catch(() => { delete giacSent[k]; }); }
  });
}
const giacenza = (d, p) => st.isAdmin ? (d.S.stock[p.id] || 0) : (typeof p.giacenza === 'number' ? p.giacenza : 1);

/* ---------- busta del caffe' ---------- */
const bustaAperta = () => st.buste.find(b => b.stato === 'aperta');
const ultimaBustaChiusa = () => st.buste.filter(b => b.stato === 'chiusa').sort((a, b) => tms(b.chiusaTs) - tms(a.chiusaTs))[0];
const tassoBusta = b => Math.round((b.n || 0) / BUSTA_CAFFE * 1000) / 10;
function bustaInc(q){
  const b = bustaAperta(); if(!b) return;
  const c = 'c_' + st.mid;
  if(q < 0 && (b[c] || 0) < -q) return;
  C('buste').doc(b.id).set({n: firebase.firestore.FieldValue.increment(q), [c]: firebase.firestore.FieldValue.increment(q)}, {merge: true}).catch(() => {});
}
function cardBusta(d, ro){
  const b = bustaAperta(), l = ultimaBustaChiusa();
  const part = b ? Object.keys(b).filter(k => k.startsWith('c_') && b[k] > 0) : [];
  const io = b && b['c_' + st.mid] > 0;
  const vedi = st.isAdmin || io;
  let h = `<div class="card"><h3><span>☕ Resa Busta Caffè</span>${b ? `<span class="pill green">in corso</span>` : ''}</h3>`;
  if(b){
    const n = b.n || 0, pc = Math.min(100, Math.round(n / BUSTA_CAFFE * 100));
    h += `<div class="between"><b class="mono" id="busta-n" style="font-size:22px">${n} <span class="mut" style="font-size:13px">/ ${BUSTA_CAFFE} caffè</span></b><span class="mut" style="font-size:12px">aperta il ${dataOra(tms(b.apertaTs) || Date.now())}</span></div>
      <div class="bar" style="margin:8px 0"><i style="width:${pc}%"></i></div>
      ${vedi && part.length ? `<div class="mut" style="font-size:12.5px;margin-bottom:8px">Hanno registrato caffè in questa busta: ${part.map(k => esc(nomeBreve(k.slice(2))) + ' (' + b[k] + ')').join(', ')}</div>` : ''}
      ${ro ? '' : `<button class="btn green block" data-act="busta-chiudi" data-id="${b.id}">Busta Terminata</button>`}`;
  } else {
    h += `<p class="mut" style="font-size:13px;margin:0 0 10px">Nessuna busta aperta: i caffè non vengono contati finché non ne apri una nuova (1 kg ≈ ${BUSTA_CAFFE} caffè).</p>
      ${ro ? '' : `<button class="btn amber block" data-act="busta-apri">Apri Nuova Busta</button>`}`;
  }
  if(l && (st.isAdmin || l['c_' + st.mid] > 0)){
    const t = tassoBusta(l), col = t >= 85 ? 'green' : t < 70 ? 'red' : 'amber';
    h += `<div class="sep"></div><div class="between"><span class="tx2" style="font-size:13px">Ultima busta · Tasso di Onestà</span><b class="mono ${col}" id="busta-tasso" style="font-size:20px">${t}%</b></div>
      <div class="mut" style="font-size:12px">${l.n || 0} caffè registrati su ${BUSTA_CAFFE} · chiusa il ${dataOra(tms(l.chiusaTs))}</div>`;
  }
  return h + `</div>`;
}
/* ---------- descrizione movimenti ---------- */
function descMov(m){
  const n = esc(nomeM(m.mid));
  switch(m.tipo){
    case 'caffe': return {ic:'☕', t: m.qta > 1 ? `${n} ha offerto un giro di ${m.qta} caffè` : `${n} ha preso un caffè`, a: -m.importo};
    case 'snack': { const p = prodotto(m.pid); return {ic: esc((p && p.emoji) || m.emoji || '🍫'), t: `${n} ha preso ${m.qta > 1 ? m.qta + ' × ' : ''}${esc((p && p.nome) || m.nome || 'snack')}`, a: -m.importo}; }
    case 'ricarica': return {ic:'💰', t: `${m.fondo ? 'Quota fondo' : 'Debito saldato'} da ${n} · ${FONTI[m.metodo] || m.metodo}`, a: m.importo, cassa: true};
    case 'scambio': return m.aMid === m.mid
      ? {ic:'🤝', t: `${esc(nomeM(m.aMid))} compra ${eur(m.importo)} di crediti da ${esc(nomeM(m.daMid))} (paga fuori dall'app)`, a: 0, neutro: m.importo}
      : {ic:'🔄', t: `${esc(nomeM(m.daMid))} vende ${eur(m.importo)} di crediti a ${esc(nomeM(m.aMid))}${m.causale ? ': ' + esc(m.causale) : ''}`, a: 0, neutro: m.importo};
    case 'riscatto': return {ic:'🏦', t: `Riscatto di ${n} · pagato dalla cassa (${FONTI[m.metodo] || m.metodo})`, a: -m.importo, cassa: true};
    case 'spesa': return {ic:'🧾', t: `Spesa di ${n}: ${esc(m.descr || '')} · ${m.fonte === 'denaro' ? 'rimborso in denaro' : m.fonte === 'tasca' ? 'rimborso in crediti' : 'pagata da ' + (FONTI[m.fonte] || m.fonte)}`, ...(m.fonte === 'tasca' ? {a: m.importo} : adminView() ? {a: -m.importo} : {a: 0, neutro: m.importo}), cassa: m.fonte !== 'tasca'};
    case 'uscita': return {ic:'💸', t: `Uscita: ${esc(m.causale || '')} · ${FONTI[m.fonte]}`, a: -m.importo, cassa: true};
    case 'entrata': return {ic:'📥', t: `Entrata: ${esc(m.causale || '')} · ${FONTI[m.fonte]}`, a: m.importo, cassa: true};
    case 'giroconto': return {ic:'🔁', t: `Giroconto ${FONTI[m.da]} → ${FONTI[m.a]}`, a: 0, neutro: m.importo, cassa: true};
    case 'quota': return {ic:'🛡️', t: `Quota ${esc(m.anno)} pagata da ${n} · ${METODI_QUOTA[m.metodo] || m.metodo}`, a: ['contanti','revolut','esterno'].includes(m.metodo) ? m.importo : 0, cassa: ['contanti','revolut'].includes(m.metodo)};
    case 'addebito_quota': return {ic:'🧾', t: `Quota fondo ${esc(m.anno)} addebitata a ${n}`, a: -m.importo};
    case 'accredito': return {ic:'🎁', t: `Credito accreditato a ${n}${m.causale ? ': ' + esc(m.causale) : ''}`, a: m.importo};
    case 'rettifica': return {ic:'✏️', t: `Rettifica saldo di ${n}${m.causale ? ': ' + esc(m.causale) : ''}`, a: m.importo};
    case 'carico': { const p = prodotto(m.pid); return {ic:'📦', t: `Giacenza ${esc((p && p.nome) || m.nome || '')} ${m.qta > 0 ? '+' : ''}${m.qta} pz`, a: 0}; }
    case 'pulizia': return {ic:'✨', t: `Pulizie: ${(m.mids||[]).map(x => esc(nomeM(x))).join(', ')} (+${m.punti ?? PUNTI_DEF} punti a testa)`, a: 0};
    case 'conversione': return {ic:'🔄', t: `${n} converte ${m.punti} Punti Pulizia in crediti`, a: m.importo};
    case 'storno': { const o = m.orig ? descMov(m.orig) : {t:''}; return {ic:'↩️', t: `Storno di: ${o.t}`, a: o.a ? -o.a : 0, cassa: o.cassa}; }
  }
  return {ic:'•', t: m.tipo, a: 0};
}

function puoStornare(m, d){
  return st.isAdmin && !m._pending && m.tipo !== 'storno' && !d.stornati.has(m.id)
    && !['attesa','rifiutata','annullata'].includes(m.stato);
}

function righeMov(list, d, opt){
  opt = opt || {};
  if(!list.length) return `<div class="empty">Nessun movimento.</div>`;
  return `<div class="list">${list.map(m => {
    const x = descMov(m);
    const annullato = m.stato === 'annullata' || m.stato === 'rifiutata' || d.stornati.has(m.id);
    const pill = m._pending || m._local ? `<span class="pill mut">invio…</span>`
      : m.stato === 'attesa' ? `<span class="pill amber">in attesa</span>`
      : m.stato === 'rifiutata' ? `<span class="pill red">rifiutata</span>`
      : m.stato === 'annullata' ? `<span class="pill mut">annullata</span>`
      : d.stornati.has(m.id) ? `<span class="pill red">stornato</span>` : '';
    const amt = x.neutro ? `<span class="tx2">${eur(x.neutro)}</span>` : x.a ? `<span class="${x.a > 0 ? 'green' : 'red'}">${eurS(x.a)}</span>` : '';
    const annullabile = !opt.noAct && m.uid === st.uid && ['caffe','snack'].includes(m.tipo) && !m.stato && !m._pending && !d.stornati.has(m.id) && Date.now() - m.t < ANNULLA_MIN*60000;
    const autore = m.autore && m.amid !== m.mid ? ` · da ${esc(m.autore)}` : '';
    return `<div class="li">
      <div class="av">${x.ic}</div>
      <div class="grow"><div class="t ${annullato ? 'strike' : ''}" style="font-weight:600;font-size:13.5px;white-space:normal">${x.t}</div>
        <div class="d">${quando(m.t)}${opt.compact ? '' : autore}${m.esitoDa && m.stato !== 'attesa' ? ` · ${m.stato} da ${esc(m.esitoDa)}` : ''}</div></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        <div class="amt mono ${annullato ? 'strike' : ''}">${amt}</div>${pill}
        ${annullabile ? `<button class="btn link" style="padding:0" data-act="annulla-consumo" data-id="${m.id}">Annulla</button>` : ''}
        ${!opt.noAct && !opt.compact && puoStornare(m, d) ? `<button class="btn link mut" style="padding:0;color:var(--mut)" data-act="storno" data-id="${m.id}">${ic('undo','s')} Storna</button>` : ''}
        ${!opt.noAct && st.isAdmin && m.stato === 'attesa' && !opt.compact ? `<div class="row" style="gap:4px"><button class="btn sm red" data-act="esito" data-id="${m.id}" data-v="rifiutata">✕</button><button class="btn sm green" data-act="${m.tipo === 'spesa' && m.fonte === 'denaro' ? 'paga-spesa' : 'esito'}" data-id="${m.id}" data-v="confermata">✓</button></div>` : ''}
      </div></div>`;
  }).join('')}</div>`;
}

/* ---------- FEED ---------- */
function pFeed(d){
  const f = st.feedFiltro, me = st.mid;
  const mio = m => m.mid === me || m.dest === me || m.daMid === me || m.aMid === me || (m.mids || []).includes(me);
  const cassaTipi = ['spesa','uscita','entrata','giroconto','ricarica','riscatto','quota','addebito_quota','accredito','rettifica'];
  let list = d.movs.slice().reverse();
  if(f === 'miei') list = list.filter(mio);
  if(f === 'bar') list = list.filter(m => ['caffe','snack'].includes(m.tipo));
  if(f === 'cassa') list = list.filter(m => descMov(m).cassa || cassaTipi.includes(m.tipo));
  if(f === 'attesa') list = list.filter(m => m.stato === 'attesa');
  const last = ultimaChiusura(), av = adminView();
  return `<h2>${ic('receipt')} Registro movimenti</h2>
  <p class="sub">Tutta la storia del fondo, visibile a tutti${last ? ' · dal ' + dataOra(last.fino.toMillis()) : ''}.</p>
  <div class="chips">${[['tutti','Tutti'],['miei','Miei'],['bar','Caffè & Snack'],['cassa','Cassa & Spese'],['attesa','In attesa']].map(([v,l]) => `<button class="${f===v?'on':''}" data-act="feed-filtro" data-v="${v}">${l}</button>`).join('')}</div>
  <div class="card">${righeMov(list.slice(0, 300), d, {noAct: st.isAdmin && !av})}</div>
  ${st.isAdmin && st.chiusure.length ? `<div class="card"><h3>${ic('archive','s')} Periodi chiusi</h3>

/* ---------- PULIZIE ---------- */
function ordinePulizie(d){
  return membriAttivi().slice().sort((a,b) => (d.S.punti[a.id]||0) - (d.S.punti[b.id]||0) || (d.S.ultimo[a.id]||0) - (d.S.ultimo[b.id]||0) || a.nome.localeCompare(b.nome));
}
function cardPunti(d){
  const pd = puntiDisp(d, st.mid), rate = puntiPerCredito(), cr = Math.floor(pd / rate);
  return `<div class="card"><h3><span>${ic('sparkles','s')} I tuoi Punti Pulizia</span><b class="mono violet">${pd}</b></h3>
    <p class="mut" style="font-size:13px;margin:0 0 10px">Ogni turno vale +${puntiPulizia()} punti a testa. ${rate} punti = 1 credito (1 €): ${cr > 0 ? `puoi convertirne fino a <b>${cr}</b>.` : `te ne servono ${rate} per il primo credito.`}</p>

}

/* ---------- EVENTI ---------- */
function prossimaData(ev){
  if(ev.tipo !== 'compleanno') return ev.data;
  const [y,m,dd] = ev.data.split('-').map(Number), oggi = oggiISO();
  let a = new Date().getFullYear();
  let s = `${a}-${pad(m)}-${pad(dd)}`;
  if(s < oggi) s = `${a+1}-${pad(m)}-${pad(dd)}`;
  return s;
}
function giorniA(iso){ const [y,m,d] = iso.split('-').map(Number); const t = new Date(y, m-1, d), o = new Date(); o.setHours(0,0,0,0); return Math.round((t - o) / 86400000); }
const backSaletta = () => adminView() ? '' : `<button class="btn link" style="padding:0;margin:0 0 8px" data-act="go" data-p="saletta">← Saletta</button>`;
function pSaletta(d){
  return `<h2>${ic('sparkles')} Saletta</h2><p class="sub">Pulizie, eventi, scorte e un po' di svago.</p>
  <div class="grid2" style="gap:14px">
    <button class="gbtn" id="sal-pulizie" data-act="go" data-p="pulizie"><span class="em">✨</span>Pulizie sala</button>
    <button class="gbtn" id="sal-eventi" data-act="go" data-p="eventi"><span class="em">📅</span>Eventi</button>
    <button class="gbtn" id="sal-inventario" data-act="go" data-p="inventario"><span class="em">📦</span>Inventario</button>
    <button class="gbtn" id="sal-gioco" data-act="go" data-p="gioco"><span class="em">🎲</span>Gioco caffè</button>
  </div>`;
}

/* ---------- Gioco caffè: chi indovina il numero paga il caffè (si gioca passandosi il telefono) ---------- */
const GIOCO0 = () => ({fase:'setup', min:0, max:1000, sel:null, ord:[], i:0, secret:0, lo:0, hi:1000, ultimo:null, storia:[], perde:null});
function giocoSt(){ if(!st.gioco) st.gioco = GIOCO0(); if(!st.gioco.sel){ st.gioco.sel = {}; membriAttivi().forEach(m => st.gioco.sel[m.id] = true); } return st.gioco; }

      ${u ? `<div id="gm-hint" class="gm-hint ${u.dir}" style="margin:12px 0"><span class="gm-arrow">${u.dir === 'su' ? '⬆️' : '⬇️'}</span><b>${u.dir === 'su' ? 'Troppo basso' : 'Troppo alto'}</b><div class="mut" style="font-size:12px">${nome(u.mid)} ha provato ${u.n}</div></div>` : '<div class="mut" style="margin:12px 0;font-size:13px">Nessun tentativo ancora</div>'}
      <div class="mut" style="font-size:12px">Tocca a</div>
      <div id="gm-turno" style="font-size:24px;font-weight:800;margin-bottom:8px">${nome(cur)}</div>
      <input class="in mono" id="gm-n" inputmode="numeric" placeholder="il tuo numero" style="text-align:center;font-size:20px" autofocus>

}
function pEventi(){
  const evs = st.eventi.map(e => ({...e, prossima: prossimaData(e)})).sort((a,b) => a.prossima.localeCompare(b.prossima));
  const fut = evs.filter(e => e.prossima >= oggiISO()), pas = evs.filter(e => e.prossima < oggiISO()).reverse();

  ${pas.length ? `<div class="card"><h3>Passati</h3><div class="list">${pas.map(row).join('')}</div></div>` : ''}`;
}

/* ---------- CASSA ---------- */
function pCassa(d){
  const c = d.S.cassa, tot = (c.contanti||0) + (c.revolut||0);
  let cred = 0, deb = 0;
  st.membri.forEach(m => { const s = d.S.saldi[m.id] || 0; if(s > 0) cred += s; else deb += s; });
  const netto = tot - cred - deb;
  const movC = d.movs.filter(m => descMov(m).cassa || (m.tipo === 'spesa')).reverse();
  return `<h2>${ic('wallet')} Registro cassa</h2><p class="sub">Liquidità del fondo e movimenti contabili.</p>
  <div class="grid3" style="margin-bottom:10px">
    <div class="stat"><small>Revolut</small><b class="mono sky">${eur(c.revolut||0)}</b></div>
    <div class="stat"><small>Contanti</small><b class="mono green">${eur(c.contanti||0)}</b></div>
    <div class="stat"><small>Totale</small><b class="mono">${eur(tot)}</b></div>
  </div>
  <div class="card">
    <div class="between" style="font-size:13px;margin-bottom:6px"><span class="tx2">Crediti prepagati dei colleghi</span><b class="mono">${eur(cred)}</b></div>
    <div class="between" style="font-size:13px;margin-bottom:6px"><span class="tx2">Debiti dei colleghi (da incassare)</span><b class="mono red">${eur(-deb)}</b></div>
    <div class="between" style="font-size:14px;border-top:1px solid var(--line);padding-top:8px"><span><b>Fondo netto</b><div class="mut" style="font-size:11px">cassa − crediti + debiti</div></span><b class="mono ${netto < 0 ? 'red' : 'amber'}" style="font-size:16px">${eur(netto)}</b></div>
  </div>

/* ---------- INVENTARIO ---------- */
function pInventario(d){
  const k = st.invSort.k, asc = st.invSort.asc ? 1 : -1;
  const v = p => k === 'stock' ? giacenza(d, p) : k === 'prezzo' ? p.prezzo : k === 'categoria' ? p.categoria : (p.nome||'').toLowerCase();
  const list = st.prodotti.filter(p => adminView() || p.attivo !== false).sort((a,b) => (a.attivo === false) - (b.attivo === false) || (v(a) > v(b) ? asc : v(a) < v(b) ? -asc : 0));
  const th = (key, l, cls='') => `<th class="s ${cls}" data-act="inv-sort" data-k="${key}">${l}${k === key ? (st.invSort.asc ? ' ↑' : ' ↓') : ''}</th>`;
  return `${backSaletta()}<div class="between" style="margin-bottom:14px"><div><h2>${ic('package')} Inventario & listino</h2><p class="sub" style="margin:0">Prezzi, giacenze e buste del caffè</p></div>
    ${adminView() ? `<button class="btn sm" style="background:#0d9488;border:0;color:#fff" data-act="prodotto" data-id="">${ic('plus','s')} Nuovo</button>` : ''}</div>
  ${cardBusta(d, adminView())}
  ${!adminView() ? `<div class="banner sky">${ic('lock')}<div>Tutti possono aprire e chiudere le buste del caffè; prezzi e giacenze li modificano solo gli amministratori.</div></div>` : ''}
  <div class="card" style="padding:6px 8px;overflow-x:auto">
  ${list.length ? `<table><thead><tr>${th('nome','Articolo')}${th('prezzo','Prezzo','r')}${th('stock','Giacenza','c')}</tr></thead><tbody>
    ${list.map(p => { const sk = giacenza(d, p); return `<tr class="${p.attivo === false ? 'strike' : ''}">
      <td>${adminView() ? `<button style="text-align:left" data-act="prodotto" data-id="${p.id}">` : '<div>'}<b>${esc(p.emoji||'')} ${esc(p.nome)}</b><div class="mut" style="font-size:11px">${p.categoria === 'fondo' ? 'Dotazione fondo' : 'A consumo'}${p.attivo === false ? ' · non attivo' : ''}${adminView() ? ' · ' + ic('edit','s').replace('class="i s"','class="i s" style="width:11px;height:11px;vertical-align:-1px"') : ''}</div>${adminView() ? '</button>' : '</div>'}</td>
      <td class="r mono amber"><b>${p.categoria === 'fondo' ? '—' : eur(p.prezzo)}</b></td>
      <td class="c">${adminView() ? `<span class="stepper"><button data-act="carico" data-id="${p.id}" data-v="-1">−</button><b class="mono ${sk <= SOGLIA_SCORTA ? 'red' : ''}">${sk}</b><button data-act="carico" data-id="${p.id}" data-v="1">+</button></span>
        <div><button class="btn link" style="font-size:11px;padding:2px" data-act="carico-n" data-id="${p.id}">carico…</button></div>` : `<b class="mono ${sk <= SOGLIA_SCORTA ? 'red' : ''}">${sk}</b>`}</td></tr>`; }).join('')}
  </tbody></table>` : `<div class="empty">Nessun articolo. ${adminView() ? 'Aggiungi il primo con “Nuovo”.' : ''}</div>`}
  </div>`;
}

    ${m.sq === 'pagata' ? `<span class="pill green">${ic('check','s').replace('class="i s"','class="i s" style="width:12px;height:12px"')} pagata</span>` : m.sq === 'dovuta' ? `<span class="pill red">da pagare</span>` : `<span class="pill mut">non addebitata</span>`}

/* ---------- STATISTICHE ---------- */
function pStatistiche(d){
  const per = st.statPeriodo;
  const ch = st.chiusure;
  let T, label;
  if(per === 'corrente'){ T = d.T; label = 'Periodo aperto' + (ultimaChiusura() ? ' (dal ' + dataOra(ultimaChiusura().fino.toMillis()).slice(0,10) + ')' : ''); }
  else { const c = ch.find(x => x.id === per); T = (c && c.stats) || emptyStats(); label = c ? labelChiusura(c) : ''; }
  const caffeTot = Object.values(T.caffe||{}).reduce((a,b) => a+b, 0);
  const snackTot = Object.values(T.snack||{}).reduce((a,b) => a+b, 0);
  const euroTot = Object.values(T.euroMid||{}).reduce((a,b) => a+b, 0);
  const topM = Object.entries(T.euroMid||{}).filter(([,v]) => v > 0).sort((a,b) => b[1]-a[1]).slice(0,8);
  const maxM = Math.max(1, ...topM.map(x => x[1]));
  const topP = Object.entries(T.snack||{}).filter(([,v]) => v > 0).sort((a,b) => b[1]-a[1]).slice(0,8);
  const maxP = Math.max(1, ...topP.map(x => x[1]));
  const serie = ch.slice(-11).map(c => ({l: new Date(c.fino.toMillis()).toLocaleDateString('it-IT',{month:'short', day:'numeric'}), v: Object.values((c.stats||{}).caffe||{}).reduce((a,b)=>a+b,0)}));
  serie.push({l:'ora', v: Object.values(d.T.caffe).reduce((a,b)=>a+b,0)});
  const maxS = Math.max(1, ...serie.map(x => x.v));
  return `<div class="between" style="margin-bottom:12px"><div><h2>${ic('chart')} Statistiche</h2><p class="sub" style="margin:0">${esc(label)}</p></div>
    <select class="in" style="width:auto;font-size:13px;padding:8px 10px" data-chg="stat-periodo">
      <option value="corrente">Periodo aperto</option>
      ${ch.slice().reverse().map(c => `<option value="${c.id}" ${per===c.id?'selected':''}>${esc(labelChiusura(c))}</option>`).join('')}
    </select></div>
  <button class="btn block" style="margin-bottom:12px" data-act="rendiconto">${ic('share','s')} Condividi rendiconto</button>
  <div class="grid3" style="margin-bottom:12px">
    <div class="stat"><small>Caffè</small><b class="mono amber">${caffeTot}</b></div>
    <div class="stat"><small>Snack</small><b class="mono">${snackTot}</b></div>
    <div class="stat"><small>Consumi</small><b class="mono">${eur(euroTot)}</b></div>
  </div>
  <div class="grid2" style="margin-bottom:12px">
    <div class="stat"><small>Ricariche</small><b class="mono green">${eur(T.ricariche||0)}</b></div>
    <div class="stat"><small>Spese</small><b class="mono red">${eur(T.spese||0)}</b></div>
  </div>
  ${serie.length > 1 ? `<div class="card"><h3>Caffè per periodo</h3><div class="cols">${serie.map(x => `<div><b class="mono">${x.v}</b><i style="height:${Math.round(x.v/maxS*100)}%"></i><span>${esc(x.l)}</span></div>`).join('')}</div></div>` : ''}
  <div class="card"><h3>Chi consuma di più</h3>${topM.length ? topM.map(([mid,v]) => `<div style="margin-bottom:9px"><div class="between" style="font-size:13px"><span>${esc(nomeM(mid))} <span class="mut">· ${(T.caffe||{})[mid]||0} caffè</span></span><b class="mono">${eur(v)}</b></div><div class="bar"><i style="width:${Math.round(v/maxM*100)}%"></i></div></div>`).join('') : '<div class="empty">Nessun consumo nel periodo.</div>'}</div>
  <div class="card"><h3>Snack più presi</h3>${topP.length ? topP.map(([pid,v]) => { const p = prodotto(pid); return `<div style="margin-bottom:9px"><div class="between" style="font-size:13px"><span>${esc(p ? (p.emoji||'') + ' ' + p.nome : 'articolo')}</span><b class="mono">${v}</b></div><div class="bar"><i style="width:${Math.round(v/maxP*100)}%;background:linear-gradient(90deg,var(--amber),#f97316)"></i></div></div>`; }).join('') : '<div class="empty">Nessuno snack nel periodo.</div>'}</div>`;
}
function labelChiusura(c){
  const a = c.da && c.da.toMillis && c.da.toMillis() > 0 ? dataOra(c.da.toMillis()).slice(0,10) : 'inizio';
  return `${a} → ${dataOra(c.fino.toMillis()).slice(0,10)}`;
}

A['crea'] = async () => {
  const nome = val('c-nome'), io = val('c-io'), nick = val('c-nick'), pin = val('c-pin');
  const pc = parseEuro(val('c-caffe')), qa = parseEuro(val('c-quota'));
  const ct = val('c-contanti') ? parseEuro(val('c-contanti')) : 0, rv = val('c-revolut') ? parseEuro(val('c-revolut')) : 0;
  if(!nome || !validaNome(io)) return toast('Scrivi il nome del gruppo e il tuo nome', 'err');
  if(!validaNick(nick)) return toast('Nickname troppo lungo', 'err');
  if(!(pc >= 0) || !(qa >= 0) || !(ct >= 0) || !(rv >= 0)) return toast('Controlla gli importi', 'err');
  if(pin.length < 6) return toast('Il PIN deve avere almeno 6 caratteri', 'err');
  if(!navigator.onLine) return toast('Serve la connessione per creare il gruppo', 'err');
  st.busy = true; render();
  try {
    const gid = newCode(), g = db.collection('saletta').doc(gid);
    const me = g.collection('membri').doc();
    await g.set({nome, prezzoCaffe: pc, quotaAnnua: qa, creatoDa: st.uid, creatoreMid: me.id, creatoIl: TS(), v: 1});
    await g.collection('segreti').doc('pin').set({pin});
    await g.collection('admin').doc(st.uid).set({pin, nome: io, ts: TS()});
    const b = db.batch();
    b.set(me, clean({nome: io, nick: nick || undefined, uid: st.uid, attivo: true, creato: TS()}));
    b.set(g.collection('utenti').doc(st.uid), {mid: me.id, nome: io, ts: TS()});
    await b.commit();
    st.gid = gid; st.mid = me.id; LS.set('gid', gid); LS.set('mid', me.id); st.entry = null; st.page = 'impostazioni'; LS.set('page','impostazioni');
    connect(gid);
    st.membri = [{id: me.id, nome: io, nick, attivo: true}];
    if(ct > 0) addMov({tipo:'entrata', fonte:'contanti', importo: ct, causale:'Saldo iniziale cassa'});
    if(rv > 0) addMov({tipo:'entrata', fonte:'revolut', importo: rv, causale:'Saldo iniziale cassa'});
    toast('Gruppo creato! Ora invita i colleghi con il codice.');
  } catch(e){ toast('Creazione non riuscita (' + errMsg(e) + ')', 'err'); }
  finally { st.busy = false; render(); }
};

A['gioco-toggle'] = ds => { const g = giocoSt(); g.sel[ds.id] = !g.sel[ds.id]; render(); };

function giocoAvvia(g){
  g.ord = Object.keys(g.sel).filter(k => g.sel[k] && membro(k)); for(let k = g.ord.length - 1; k > 0; k--){ const j = Math.floor(Math.random() * (k + 1)); [g.ord[k], g.ord[j]] = [g.ord[j], g.ord[k]]; }
  g.fase = 'play'; g.i = 0; g.lo = g.min; g.hi = g.max; g.secret = g.min + Math.floor(Math.random() * (g.max - g.min + 1)); g.ultimo = null; g.storia = []; g.perde = null;
}
A['gioco-start'] = () => {
  const g = giocoSt(), mn = parseInt(val('gm-min'), 10), mx = parseInt(val('gm-max'), 10);
  if(!Number.isInteger(mn) || !Number.isInteger(mx) || mn < 0 || mx > 1000 || mx - mn < 2) return toast('Scegli un intervallo tra 0 e 1000 con almeno 3 numeri', 'err');
  if(Object.keys(g.sel).filter(k => g.sel[k]).length < 2) return toast('Servono almeno 2 giocatori', 'err');
  g.min = mn; g.max = mx; giocoAvvia(g); render();
};
A['gioco-ancora'] = () => { const g = giocoSt(); giocoAvvia(g); render(); };
A['gioco-prova'] = () => {
  const g = giocoSt(), n = parseInt(val('gm-n'), 10);
  if(!Number.isInteger(n) || n < g.lo || n > g.hi) return toast(`Scrivi un numero tra ${g.lo} e ${g.hi}`, 'err');
  const mid = g.ord[g.i];
  if(n === g.secret){ g.storia.push({mid, n, dir: 'ok'}); g.perde = mid; g.fase = 'fine'; try { navigator.vibrate && navigator.vibrate([120, 60, 120, 60, 300]); } catch(e){} render(); return; }
  const dir = n < g.secret ? 'su' : 'giu';
  if(dir === 'su') g.lo = n + 1; else g.hi = n - 1;
  g.ultimo = {mid, n, dir}; g.storia.push({mid, n, dir}); g.i = (g.i + 1) % g.ord.length; render();
};

A['conferma-elimina-gruppo'] = async () => {
  const g0 = st.gruppo; if(!g0 || st.busy) return;
  if(val('eg-nome').trim() !== g0.nome) return toast('Il nome non corrisponde', 'err');
  if(!navigator.onLine) return toast('Serve la connessione per eliminare il gruppo', 'err');
  const gid = st.gid, g = db.collection('saletta').doc(gid), me = st.uid;
  st.busy = true; closeSheet(); toast('Eliminazione in corso…');
  try {
    // 1) leggo tutto finché le regole mi riconoscono; l'ordine di cancellazione tiene per ultimi amministratori e collegamenti telefono
    const cols = ['movimenti','buste','riscatti','acquisti','eventi','chiusure','archivio','estratti','prodotti','membri','richieste','richiesteAdmin','bloccati','admin','utenti'];
    const snaps = await Promise.all(cols.map(n => g.collection(n).get()));
    const ownUtente = g.collection('utenti').doc(me);
    const refs = [g.collection('segreti').doc('pin')];
    cols.forEach((n, i) => snaps[i].docs.forEach(d => { if(!(n === 'utenti' && d.id === me)) refs.push(d.ref); }));
    disconnect();
    for(let i = 0; i < refs.length; i += 400){
      const b = db.batch(); refs.slice(i, i + 400).forEach(r => b.delete(r)); await b.commit();
    }
    await g.delete();
    await ownUtente.delete().catch(() => {});
    st.gid = null; st.mid = null; st.entry = null; LS.del('gid'); LS.del('mid'); LS.del('page');
    toast('Gruppo eliminato');
  } catch(e){ toast('Eliminazione non riuscita (' + errMsg(e) + '). Riprova: i dati già cancellati non tornano.', 'err'); }
  finally { st.busy = false; render(); }
};

A['chiudi-periodo'] = async () => {
  const d = derived();
  if(st.sync !== 'ok') return toast('Serve la connessione per chiudere il periodo', 'err');
  const limite = Date.now() - CHIUSURA_MARGINE;
  if(st.movimenti.some(m => m.t <= limite && (m._local || !m._ts)) || Object.keys(st.pending).length) return toast('Attendi che tutti i movimenti siano sincronizzati', 'err');
  const incl = st.movimenti.filter(m => m.t <= limite);
  if(!incl.length) return toast('Nessun movimento da chiudere', 'err');
  if(incl.some(m => m.stato === 'attesa' && m.tipo !== 'scambio')) return toast('Prima conferma o rifiuta le richieste in attesa', 'err');
  if(incl.some(m => m.stato === 'attesa' && m.tipo === 'scambio')) return toast('Ci sono scambi di crediti in attesa: devono accettarli o rifiutarli i colleghi destinatari', 'err');
  if(!confirm(`Chiudere il periodo con ${incl.length} movimenti?`)) return;
  st.busy = true; render();
  try {
    const prev = ultimaChiusura();
    const S = prev && prev.stato ? JSON.parse(JSON.stringify(prev.stato)) : emptyState();
    ['saldi','stock','turni','ultimo','punti','puntiConv','quote','dovute'].forEach(k => S[k] = S[k] || {}); S.cassa = S.cassa || {contanti:0, revolut:0};
    const T = emptyStats();
    incl.forEach(m => { applyMov(S, m); applyStat(T, m); });
    let fino = incl[0]._ts;
    incl.forEach(m => { if(m._ts.seconds > fino.seconds || (m._ts.seconds === fino.seconds && m._ts.nanoseconds > fino.nanoseconds)) fino = m._ts; });
    const id = 'c' + fino.toMillis();
    const b = db.batch();
    b.set(C('chiusure').doc(id), {fino, da: prev ? prev.fino : firebase.firestore.Timestamp.fromMillis(0), stato: S, stats: T, n: incl.length, uid: st.uid, autore: myName(), ts: TS()});
    const arr = incl.map(compactMov);
    st.membri.forEach(m => {
      const q = {}, dv = {};
      for(const a in S.quote) if(S.quote[a][m.id]) q[a] = S.quote[a][m.id];
      for(const a in S.dovute) if(S.dovute[a][m.id]) dv[a] = S.dovute[a][m.id];
      b.set(C('estratti').doc(m.id), {saldo: S.saldi[m.id] || 0, saldi: S.saldi, cassa: S.cassa, quote: q, dovute: dv, fino, chiusura: id});
    });
    for(let i = 0; i * ARCHIVIO_CHUNK < arr.length; i++) b.set(C('archivio').doc(id + '_' + i), {movimenti: arr.slice(i*ARCHIVIO_CHUNK, (i+1)*ARCHIVIO_CHUNK)});
    await b.commit();
    st.archivio = null;
    toast('Periodo chiuso: ' + incl.length + ' movimenti archiviati');
  } catch(e){ toast('Chiusura non riuscita (' + errMsg(e) + ')', 'err'); }
  finally { st.busy = false; render(); }
};

function scaricaBlob(blob, nome){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function condividiBlob(blob, nome, titolo, testo, avviso){
  const f = new File([blob], nome, {type: blob.type});
  if(navigator.canShare && navigator.canShare({files: [f]})){
    try { await navigator.share({files: [f], title: titolo, text: testo}); return true; }
    catch(e){ if(e && e.name === 'AbortError') return false; }
  }
  scaricaBlob(blob, nome); toast(avviso || 'File scaricato'); return false;
}
async function costruisciBackup(){
  const arch = await C('archivio').get();
  const est = await C('estratti').get();
  const d = derived();
  const ts = x => x && x.toMillis ? x.toMillis() : (x || null);
  return {
    app: 'Armieri 5.0', formato: 2, versione: VERSION, esportato: new Date().toISOString(), gruppo: {...st.gruppo, id: st.gid},
    membri: st.membri, prodotti: st.prodotti, eventi: st.eventi.map(e => ({...e, ts: ts(e.ts)})),
    chiusure: st.chiusure.map(c => ({...c, fino: ts(c.fino), da: ts(c.da) || 0, ts: ts(c.ts)})),
    archivio: arch.docs.map(x => ({id: x.id, ...x.data()})),
    estratti: est.docs.map(x => ({id: x.id, ...x.data(), fino: ts(x.data().fino)})),
    movimentiAperti: tuttiMov().map(compactMov),
    situazione: d.S,
    saldiLeggibili: st.membri.map(m => ({nome: m.nome, nick: m.nick || '', attivo: m.attivo !== false, saldo: (d.S.saldi[m.id] || 0) / 100}))
  };
}
A['backup'] = async () => {
  try {
    const blob = new Blob([JSON.stringify(await costruisciBackup(), null, 1)], {type: 'application/json'});
    scaricaBlob(blob, `armieri_backup_${oggiISO()}.json`);
    LS.set('backup_' + st.gid, Date.now()); render(); toast('Backup scaricato');
  } catch(e){ toast('Backup non riuscito (' + errMsg(e) + ')', 'err'); }
};
A['backup-invia'] = async () => {

const csvCella = v => { v = plain(v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
const csvRiga = r => r.map(csvCella).join(';');
const numIt = c => (c / 100).toFixed(2).replace('.', ',');

  try {
    const b = await costruisciBackup();
    const d = derived();
    const righeS = [['Nome','Nickname','Stato','Saldo €']].concat(st.membri.map(m => [m.nome, m.nick || '', m.attivo === false ? (m.espulso ? 'espulso' : 'archiviato') : 'attivo', numIt(d.S.saldi[m.id] || 0)]));
    scaricaBlob(new Blob(['﻿' + righeS.map(csvRiga).join('\r\n')], {type: 'text/csv'}), `armieri_saldi_${oggiISO()}.csv`);
    const tutti = [];
    b.archivio.forEach(x => (x.movimenti || []).forEach(m => tutti.push(m)));
    b.movimentiAperti.forEach(m => tutti.push(m));

      const ds = descMov(m);
